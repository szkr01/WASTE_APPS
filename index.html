<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>WASTE APPS</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #080808;
            color: #f5f5f5;
        }

        * { box-sizing: border-box; }

        html { background: #080808; }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% -10%, rgba(255,255,255,.065), transparent 34rem),
                #080808;
            color: #f5f5f5;
        }

        button,
        input { font: inherit; }

        a { color: inherit; }

        .shell {
            width: min(100% - 32px, 920px);
            margin: 0 auto;
            padding: 64px 0 40px;
        }

        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 30px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #737373;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 7vw, 58px);
            line-height: .95;
            letter-spacing: -.055em;
            font-weight: 780;
        }

        .repo-link {
            flex: none;
            color: #8a8a8a;
            font-size: 13px;
            text-decoration: none;
            transition: color 120ms ease;
        }

        .repo-link:hover { color: #fff; }

        .search-wrap {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 12px 0 14px;
            background: linear-gradient(#080808 72%, rgba(8,8,8,0));
        }

        .search {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 12px;
            height: 52px;
            padding: 0 14px;
            border: 1px solid #272727;
            border-radius: 14px;
            background: rgba(18,18,18,.96);
            box-shadow: 0 10px 30px rgba(0,0,0,.22);
            transition: border-color 120ms ease, background 120ms ease;
        }

        .search:focus-within {
            border-color: #505050;
            background: #151515;
        }

        .search-icon {
            width: 18px;
            height: 18px;
            color: #737373;
        }

        #search-input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #f5f5f5;
            font-size: 16px;
        }

        #search-input::placeholder { color: #666; }

        kbd {
            padding: 3px 7px;
            border: 1px solid #303030;
            border-bottom-color: #3b3b3b;
            border-radius: 6px;
            background: #1b1b1b;
            color: #777;
            font-family: inherit;
            font-size: 11px;
            line-height: 1;
        }

        .meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 44px;
            padding: 0 4px;
            color: #666;
            font-size: 12px;
        }

        .list {
            overflow: hidden;
            margin: 0;
            padding: 0;
            border: 1px solid #202020;
            border-radius: 16px;
            background: #0d0d0d;
            list-style: none;
        }

        .app-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 18px;
            min-height: 68px;
            padding: 12px 18px;
            border-bottom: 1px solid #1c1c1c;
            text-decoration: none;
            transition: background 100ms ease;
        }

        .app-row:last-child { border-bottom: 0; }

        .app-row:hover,
        .app-row:focus-visible {
            outline: 0;
            background: #151515;
        }

        .app-main {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .index {
            width: 30px;
            flex: none;
            color: #4e4e4e;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .app-text { min-width: 0; }

        .app-title {
            overflow: hidden;
            margin: 0;
            color: #eaeaea;
            font-size: 15px;
            font-weight: 620;
            line-height: 1.35;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-file {
            overflow: hidden;
            margin: 4px 0 0;
            color: #626262;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 11px;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .arrow {
            color: #454545;
            font-size: 20px;
            line-height: 1;
            transition: color 100ms ease, transform 100ms ease;
        }

        .app-row:hover .arrow,
        .app-row:focus-visible .arrow {
            color: #bcbcbc;
            transform: translateX(2px);
        }

        .state {
            padding: 42px 20px;
            border: 1px dashed #262626;
            border-radius: 16px;
            color: #666;
            text-align: center;
        }

        .error {
            border-color: #482222;
            color: #d48a8a;
            white-space: pre-wrap;
        }

        .footer {
            padding-top: 28px;
            color: #454545;
            font-size: 11px;
            text-align: center;
        }

        [hidden] { display: none !important; }

        @media (max-width: 620px) {
            .shell {
                width: min(100% - 20px, 920px);
                padding-top: 38px;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 18px;
            }

            .repo-link { display: none; }
            .app-row { min-height: 64px; padding-inline: 13px; }
            .index { display: none; }
            kbd { display: none; }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="header">
            <div>
                <p class="eyebrow">A Waste Collection</p>
                <h1>WASTE APPS</h1>
            </div>
            <a class="repo-link" href="https://github.com/szkr01/WASTE_APPS" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
        </header>

        <div class="search-wrap">
            <label class="search" for="search-input">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle>
                    <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
                </svg>
                <input id="search-input" type="search" placeholder="Search apps..." autocomplete="off" spellcheck="false">
                <kbd>/</kbd>
            </label>
        </div>

        <div class="meta">
            <span id="result-count">Loading…</span>
            <span>Enter to open first result</span>
        </div>

        <ul id="app-list" class="list" hidden></ul>
        <div id="empty-state" class="state" hidden>No matching apps.</div>
        <div id="error-state" class="state error" hidden></div>

        <footer class="footer">© <span id="year"></span> szkr01</footer>
    </main>

    <script>
        const OWNER = 'szkr01';
        const REPO = 'WASTE_APPS';
        const BRANCH = 'main';
        const PAGES_DIR = 'pages';
        const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PAGES_DIR}?ref=${BRANCH}`;
        const elements = {
            search: document.getElementById('search-input'),
            list: document.getElementById('app-list'),
            count: document.getElementById('result-count'),
            empty: document.getElementById('empty-state'),
            error: document.getElementById('error-state')
        };
        let apps = [];
        let visibleApps = [];

        function titleFromFilename(filename) {
            return filename
                .replace(/\.html$/i, '')
                .replace(/[_-]+/g, ' ')
                .replace(/([a-z0-9])([A-Z])/g, '$1 $2')
                .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function normalize(text) {
            return text.toLocaleLowerCase().normalize('NFKC');
        }

        function createRow(app, index) {
            const item = document.createElement('li');
            const link = document.createElement('a');
            const main = document.createElement('div');
            const number = document.createElement('span');
            const text = document.createElement('div');
            const title = document.createElement('p');
            const file = document.createElement('p');
            const arrow = document.createElement('span');

            link.className = 'app-row';
            link.href = `${PAGES_DIR}/${encodeURIComponent(app.filename)}`;
            main.className = 'app-main';
            number.className = 'index';
            text.className = 'app-text';
            title.className = 'app-title';
            file.className = 'app-file';
            arrow.className = 'arrow';
            number.textContent = String(index + 1).padStart(2, '0');
            title.textContent = app.title;
            file.textContent = app.filename;
            arrow.textContent = '›';
            arrow.setAttribute('aria-hidden', 'true');

            text.append(title, file);
            main.append(number, text);
            link.append(main, arrow);
            item.append(link);
            return item;
        }

        function render() {
            const query = normalize(elements.search.value.trim());
            visibleApps = query ? apps.filter(app => app.searchText.includes(query)) : apps;
            elements.list.replaceChildren(...visibleApps.map(createRow));
            elements.list.hidden = visibleApps.length === 0;
            elements.empty.hidden = visibleApps.length !== 0;
            elements.count.textContent = query ? `${visibleApps.length} / ${apps.length} apps` : `${apps.length} apps`;
        }

        async function loadApps() {
            const response = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } });
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${response.statusText}`);
            const contents = await response.json();
            if (!Array.isArray(contents)) throw new Error(`Unexpected GitHub API response for /${PAGES_DIR}.`);

            apps = contents
                .filter(file => file.type === 'file' && /\.html$/i.test(file.name))
                .map(file => {
                    const title = titleFromFilename(file.name);
                    return { filename: file.name, title, searchText: normalize(`${title} ${file.name}`) };
                })
                .sort((a, b) => a.title.localeCompare(b.title, undefined, { numeric: true, sensitivity: 'base' }));

            render();
        }

        elements.search.addEventListener('input', render);
        elements.search.addEventListener('keydown', event => { if (event.key === 'Enter' && visibleApps.length > 0) window.location.href = `${PAGES_DIR}/${encodeURIComponent(visibleApps[0].filename)}`; });
        document.addEventListener('keydown', event => { if (event.key === '/' && document.activeElement !== elements.search) { event.preventDefault(); elements.search.focus(); } if (event.key === 'Escape' && document.activeElement === elements.search) { elements.search.value = ''; render(); elements.search.blur(); } });
        document.getElementById('year').textContent = new Date().getFullYear();

        loadApps().catch(error => {
            console.error(error);
            elements.list.hidden = true;
            elements.empty.hidden = true;
            elements.error.hidden = false;
            elements.error.textContent = `Failed to load apps.\n${error.message}`;
            elements.count.textContent = 'Load failed';
        });
    </script>
</body>
</html>
