<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="8次元潜在空間を操作する、ブラウザ内ONNX画像生成インターフェース。Euler AncestralとDDPMに対応。">
  <meta name="page:icon" content="fas fa-microchip">
  <meta name="page:color" content="#7AAAFF">
  <meta name="theme-color" content="#151517">
  <title>DiT GLO — Latent Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <style>
    :root {
      --ease-out: cubic-bezier(.23,1,.32,1);
      --ease-std: cubic-bezier(.4,0,.2,1);
      --canvas:#151517; --surface:#232324; --raised:#2c2c2e; --hoverfill:#353638; --sidebar:#1b1b1c;
      --text:#f9fafb; --secondary:#cfd3d6; --muted:#adb2b8; --placeholder:#81858c; --stroke:rgba(255,255,255,.12);
      --stroke-soft:rgba(255,255,255,.06); --stroke-elev:rgba(255,255,255,.20); --accent:#7aaaff;
      --accent-soft:rgba(122,170,255,.12); --pressed:rgba(255,255,255,.14); --hover:rgba(255,255,255,.08);
      --success:#22c55e; --warning:#f59e0b; --error:#f25a5a; --inverse:#0f1115;
      --field:#353638; --track:#43454a;
      color-scheme:dark;
    }
    html[data-theme="light"] {
      --canvas:#fff; --surface:#fff; --raised:#fff; --hoverfill:#f5f6f7; --sidebar:#f9fafb;
      --text:#0f1115; --secondary:#61666b; --muted:#81858c; --placeholder:#adb2b8; --stroke:rgba(0,0,0,.10);
      --stroke-soft:rgba(0,0,0,.04); --stroke-elev:rgba(0,0,0,.16); --accent:#4176e6;
      --accent-soft:rgba(65,118,230,.08); --pressed:rgba(38,49,72,.10); --hover:rgba(38,49,72,.06);
      --success:#22c55e; --warning:#f59e0b; --error:#ec1313; --inverse:#fff;
      --field:#f5f6f7; --track:#e1e5ee;
      color-scheme:light;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0; width:100%;height:100%;min-height:100%;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
      color:var(--text);background:var(--canvas);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:disabled{cursor:not-allowed;opacity:.4}
    button:active:not(:disabled){transform:scale(.97)}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    input[type=number]:focus,input[type=range]:focus{outline:none}
    input[type=number]:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    ::selection{background:var(--accent-soft)}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-thumb{background:var(--track);border-radius:8px}
    ::-webkit-scrollbar-track{background:transparent}
    .shell{display:flex;flex-direction:column;width:100%;height:100dvh;min-height:530px;overflow:hidden}
    .app-header{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;
      background:var(--surface);border-bottom:.5px solid var(--stroke);position:relative;z-index:2}
    .brand-mark{width:32px;height:32px;display:grid;place-items:center;background:var(--hoverfill);color:var(--text);border-radius:8px;corner-shape:superellipse(1.5);font-size:14px}
    .brand-title{font-size:15px;font-weight:650;letter-spacing:-.3px;line-height:1.25}
    .brand-sub{font-size:11px;color:var(--muted);line-height:1.25;margin-top:2px}
    .app-chip{font-size:10px;font-weight:600;letter-spacing:.05em;padding:4px 7px;border-radius:4px;background:var(--hoverfill);color:var(--muted);white-space:nowrap}
    .header-actions{display:flex;align-items:center;gap:12px}
    .status{display:flex;gap:8px;align-items:center;color:var(--secondary);font-size:12px;white-space:nowrap}
    .status-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--warning)}
    .status[data-status="ready"] .status-dot{background:var(--success)}
    .status[data-status="busy"] .status-dot{background:var(--accent);animation:pulse 1s ease-in-out infinite}
    .status[data-status="error"] .status-dot{background:var(--error)}
    .status[data-status="loading"] .status-dot{animation:pulse 1.1s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.3}}
    .icon-button{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;color:var(--secondary);border-radius:8px;
      corner-shape:superellipse(1.5);transition:background-color 150ms var(--ease-out),transform 120ms var(--ease-out)}
    .workspace{display:flex;flex:1;min-height:0}
    .sidebar{width:280px;flex:0 0 280px;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--sidebar);
      border-right:.5px solid var(--stroke)}
    .sidebar-scroll{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain}
    .side-section{padding:20px 16px 18px}
    .side-section + .side-section{border-top:.5px solid var(--stroke)}
    .eyebrow{font-size:10px;letter-spacing:.055em;color:var(--muted);font-weight:650;line-height:1.6}
    .section-title{font-size:13px;font-weight:620;line-height:1.5;color:var(--text)}
    .section-help{font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px}
    .count-label{font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier;font-size:10px;color:var(--muted)}
    .latent-grid{margin-top:19px;display:flex;flex-direction:column;gap:17px}
    .latent-row{min-width:0}
    .latent-row-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
    .latent-name{font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier;font-size:11px;color:var(--secondary)}
    .latent-value{font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
    .latent-range{-webkit-appearance:none;appearance:none;height:16px;width:100%;margin:0;display:block;cursor:pointer;background:transparent}
    .latent-range::-webkit-slider-runnable-track{height:4px;border-radius:8px;background:linear-gradient(to right,var(--accent) 0%,var(--accent) var(--percent,50%),var(--track) var(--percent,50%),var(--track) 100%)}
    .latent-range::-moz-range-track{height:4px;border-radius:8px;background:var(--track)}
    .latent-range::-moz-range-progress{height:4px;border-radius:8px;background:var(--accent)}
    .latent-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;background:var(--surface);width:14px;height:14px;border-radius:50%;margin-top:-5px;
      border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.15)}
    .latent-range::-moz-range-thumb{background:var(--surface);width:9px;height:9px;border:3px solid var(--accent);border-radius:50%}
    .settings-section{padding-top:19px;padding-bottom:21px}
    .field-group{margin-top:17px}
    .field-label{display:block;font-size:11px;color:var(--secondary);font-weight:550;margin-bottom:7px}
    .field-row{display:grid;grid-template-columns:1fr 84px;gap:8px}
    .field{height:36px;min-width:0;width:100%;background:var(--field);color:var(--text);border:0;border-radius:12px;
      corner-shape:superellipse(1.5);box-shadow:inset 0 0 0 .5px var(--stroke);padding:0 11px;font-size:12px;transition:box-shadow 150ms var(--ease-out)}
    .field:focus{box-shadow:inset 0 0 0 1px var(--accent)}
    .field:disabled{color:var(--placeholder);opacity:.52}
    select.field{padding-right:24px;cursor:pointer}
    .field.number{text-align:right;font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier; font-variant-numeric:tabular-nums}
    .seed-input-row{display:grid;grid-template-columns:1fr 36px;gap:8px;margin-top:8px}
    .roll-button{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:var(--field);color:var(--secondary);border:0;box-shadow:inset 0 0 0 .5px var(--stroke);transition:transform 130ms var(--ease-out),background-color 150ms ease}
    .sidebar-footer{flex:0 0 auto;padding:16px;border-top:.5px solid var(--stroke);background:var(--sidebar)}
    .progress-row{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;margin-bottom:10px}
    .progress-num{font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier;font-variant-numeric:tabular-nums;color:var(--secondary)}
    .progress-track{height:4px;border-radius:10px;background:var(--track);overflow:hidden}
    .progress-fill{height:100%;width:0;background:var(--accent);border-radius:10px;transition:width 100ms linear}
    .action-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
    .button{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-width:0;border:0;border-radius:12px;
      corner-shape:superellipse(1.5);font-size:12px;font-weight:550;white-space:nowrap;transition:transform 130ms var(--ease-out),background-color 150ms ease,color 150ms ease}
    .button.ghost{background:var(--hoverfill);color:var(--text);box-shadow:inset 0 0 0 .5px var(--stroke-soft)}
    .button.primary{background:var(--accent);color:var(--inverse);font-weight:650}
    .button.primary[data-running="true"]{background:var(--error);color:#fff}
    .preview-area{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;background:var(--canvas)}
    .preview-bar{display:flex;align-items:center;justify-content:space-between;flex:0 0 56px;height:56px;padding:0 26px;border-bottom:.5px solid var(--stroke-soft);gap:12px}
    .preview-heading{font-size:13px;font-weight:600;color:var(--text)}
    .meta-quiet{font-size:11px;color:var(--muted)}
    .save-button{height:30px;display:inline-flex;gap:8px;align-items:center;background:var(--field);color:var(--secondary);border:0;
      box-shadow:inset 0 0 0 .5px var(--stroke-soft);border-radius:8px;corner-shape:superellipse(1.5);padding:0 12px;font-size:11px;
      transition:background-color 150ms ease,transform 130ms var(--ease-out)}
    .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;flex:1;overflow-y:auto;
      padding:30px 24px 36px;gap:21px}
    .canvas-frame{width:min(100%, 512px, calc(100dvh - 277px));min-width:180px;aspect-ratio:1;flex:0 0 auto;background:#000;border-radius:16px;
      corner-shape:superellipse(1.5);overflow:hidden;box-shadow:0 0 0 .5px var(--stroke-elev),0 3px 8px rgba(0,0,0,.04),0 0 20px rgba(0,0,0,.05);position:relative}
    #output-canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
    .canvas-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#adb2b8;
      font-size:12px;background:rgba(0,0,0,.72);transition:opacity 200ms ease}
    .canvas-loading[data-hidden="true"]{opacity:0}
    .canvas-loading .fa-circle-notch{margin-right:10px}
    .output-meta{width:min(100%,512px);display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
    .output-message{font-size:12px;color:var(--secondary);margin:0;max-width:360px;overflow-wrap:anywhere}
    .output-info{font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier;
      font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:5px;min-height:16px}
    .output-meta-right{text-align:right;font-size:10px;color:var(--muted);white-space:nowrap;padding-top:1px}
    .bottom-bar{flex:0 0 32px;border-top:.5px solid var(--stroke-soft);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:8px;
      color:var(--muted);font-family:"SF Mono","JetBrains Mono",Consolas,"Liberation Mono",Menlo,Courier;font-size:10px}
    .bottom-bar span{white-space:nowrap}
    @media (hover:hover) and (pointer:fine){
      .icon-button:hover{background:var(--hover)}
      .roll-button:hover,.button.ghost:hover,.save-button:hover{background:var(--pressed)}
      .button.primary:not([data-running="true"]):hover{filter:brightness(1.08)}
      .button.primary[data-running="true"]:hover{filter:brightness(1.08)}
    }
    @media (max-width:760px){
      .app-header{height:55px;flex-basis:55px;padding:0 15px}
      .workspace{flex-direction:column;overflow-y:auto}
      .sidebar{width:100%;flex:none;border-right:0;border-bottom:.5px solid var(--stroke)}
      .sidebar-scroll{overflow:visible}
      .side-section{padding:16px}
      .latent-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px;row-gap:13px;margin-top:12px}
      .sidebar-footer{padding:14px 16px}
      .settings-section{padding:14px 16px}
      .settings-content{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .settings-content .field-group{margin-top:8px}
      .preview-area{flex:none;min-height:530px}
      .preview-bar{padding:0 16px;height:50px;flex-basis:50px}
      .stage{padding:22px 18px 26px}
      .canvas-frame{width:min(100%, 440px, calc(100vw - 40px));}
      .bottom-bar{padding:0 16px}
      .shell{min-height:100dvh;height:auto;overflow:visible}
    }
    @media (max-width:440px){.brand-sub,.app-chip,.status-text-detail{display:none}.header-actions{gap:5px}.settings-content{grid-template-columns:1fr}.latent-grid{gap:12px}.preview-area{min-height:460px}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0ms!important;transition-duration:0ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <div class="flex items-center gap-3 min-w-0">
        <div class="brand-mark" aria-hidden="true"><i class="fa-solid fa-microchip"></i></div>
        <div class="min-w-0"><div class="brand-title">DiT GLO <span style="font-weight:400;color:var(--muted)">/ Latent Studio</span></div><div class="brand-sub">Interactive image generation</div></div>
        <span class="app-chip ml-1">ONNX LOCAL</span>
      </div>
      <div class="header-actions">
        <div class="status" id="status-indicator" data-status="loading" role="status" aria-live="polite"><span class="status-dot"></span><span id="status-text">モデルを読み込み中</span></div>
        <div style="width:.5px;height:18px;background:var(--stroke);margin:0 2px" aria-hidden="true"></div>
        <button id="theme-btn" class="icon-button" type="button" aria-label="ライトテーマに切り替える" title="テーマ切り替え"><i id="theme-icon" class="fa-regular fa-sun"></i></button>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" aria-label="生成設定">
        <div class="sidebar-scroll">
          <section class="side-section">
            <div class="flex items-center justify-between"><div class="section-title">潜在ベクトル</div><div class="count-label">8 DIMENSIONS</div></div>
            <p class="section-help">各次元を −3.00 〜 +3.00 の範囲で調整</p>
            <div id="sliders-wrapper" class="latent-grid"></div>
          </section>
          <section class="side-section settings-section">
            <div class="section-title">生成パラメータ</div>
            <div class="settings-content">
              <div class="field-group">
                <label class="field-label" for="sampler-select">サンプラー</label>
                <div class="field-row">
                  <select id="sampler-select" class="field" aria-label="サンプラー">
                    <option value="euler_a">Euler a</option>
                    <option value="ddpm">DDPM</option>
                  </select>
                  <input id="steps-input" class="field number" type="number" value="25" min="2" max="1000" step="1" aria-label="生成ステップ数">
                </div>
                <div class="section-help" id="sampler-help" style="margin-top:5px">Steps · 25</div>
              </div>
              <div class="field-group">
                <label class="field-label" for="seed-mode">Seed</label>
                <select id="seed-mode" class="field" aria-label="Seedモード">
                  <option value="random">Random — 毎回変更</option>
                  <option value="fixed">Fixed — 固定</option>
                  <option value="increment">Increment — +1</option>
                </select>
                <div class="seed-input-row">
                  <input type="number" class="field number" id="input-seed" value="0" aria-label="Seed値">
                  <button id="btn-roll-seed" class="roll-button" type="button" title="Seedを再抽選" aria-label="Seedを再抽選"><i class="fa-solid fa-dice"></i></button>
                </div>
              </div>
            </div>
          </section>
        </div>
        <div class="sidebar-footer">
          <div class="progress-row"><span>生成の進捗</span><span class="progress-num" id="step-counter">0 / 25</span></div>
          <div class="progress-track" role="progressbar" aria-label="生成進捗" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
          <div class="action-row">
            <button class="button ghost" id="random-btn" type="button"><i class="fa-solid fa-shuffle"></i>Random Z</button>
            <button class="button primary" id="generate-btn" type="button" disabled data-running="false"><i id="generate-icon" class="fa-solid fa-play" style="font-size:11px"></i><span id="generate-label">Generate</span></button>
          </div>
        </div>
      </aside>

      <section class="preview-area" aria-label="生成結果プレビュー">
        <div class="preview-bar">
          <div class="flex items-center gap-3 min-w-0"><span class="preview-heading">プレビュー</span><span class="meta-quiet">128 × 128 · Grayscale</span></div>
          <button id="download-btn" class="save-button" type="button"><i class="fa-solid fa-download"></i><span>PNGを保存</span></button>
        </div>
        <div class="stage">
          <div class="canvas-frame">
            <canvas id="output-canvas" width="128" height="128" aria-label="生成されたグレースケール画像" role="img"></canvas>
            <div class="canvas-loading" id="canvas-loading"><span><i class="fa-solid fa-circle-notch fa-spin"></i>モデルを準備しています</span></div>
          </div>
          <div class="output-meta">
            <div style="min-width:0"><p class="output-message" id="message-text">モデルを読み込み中...</p><div class="output-info" id="info-display">Seed: —　/　Sampler: —</div></div>
            <div class="output-meta-right" id="provider-display">INFERENCE <span id="provider-label">—</span></div>
          </div>
        </div>
        <footer class="bottom-bar"><span>DiT GLO <span style="color:var(--placeholder)">·</span> 8D LATENT</span><span>ONNX Runtime Web <span style="color:var(--placeholder)">·</span> 128²</span></footer>
      </section>
    </main>
  </div>
<script>
  const CONFIG = {
    modelPath: 'https://szkr01.github.io/WASTE_APPS/Assets/dit_glo.onnx',
    imageSize: 128,
    latentDim: 8,
    maxTimesteps: 1000,
    activeProvider: null
  };
  const state = { session: null, isGenerating: false, latents: new Array(CONFIG.latentDim).fill(0), stopSignal: false, seed: 0 };
  const els = {
    status: document.getElementById('status-indicator'), statusText: document.getElementById('status-text'),
    generateBtn: document.getElementById('generate-btn'), generateLabel: document.getElementById('generate-label'),
    generateIcon: document.getElementById('generate-icon'), randomBtn: document.getElementById('random-btn'),
    downloadBtn: document.getElementById('download-btn'), progressBar: document.getElementById('progress-bar'),
    progressTrack: document.getElementById('progress-track'), stepCounter: document.getElementById('step-counter'),
    slidersWrapper: document.getElementById('sliders-wrapper'), canvas: document.getElementById('output-canvas'),
    loadingOverlay: document.getElementById('canvas-loading'), message: document.getElementById('message-text'),
    inputSeed: document.getElementById('input-seed'), btnRollSeed: document.getElementById('btn-roll-seed'),
    seedMode: document.getElementById('seed-mode'), infoDisplay: document.getElementById('info-display'),
    samplerSelect: document.getElementById('sampler-select'), stepsInput: document.getElementById('steps-input'),
    samplerHelp: document.getElementById('sampler-help'), providerLabel: document.getElementById('provider-label'),
    themeBtn: document.getElementById('theme-btn'), themeIcon: document.getElementById('theme-icon')
  };
  const ctx = els.canvas.getContext('2d');

  function linspace(start, stop, num) {
    const result = [];
    const step = num > 1 ? (stop - start) / (num - 1) : 0;
    for (let i = 0; i < num; i++) result.push(start + step * i);
    return result;
  }
  function cumprod(array) {
    let acc = 1;
    return array.map(value => (acc *= value));
  }
  function mulberry32(a) {
    return function () {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function randn(size, rng) {
    const data = new Float32Array(size);
    for (let i = 0; i < size; i++) {
      let u = 0, v = 0;
      while (u === 0) u = rng();
      while (v === 0) v = rng();
      data[i] = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
    return data;
  }
  const BETAS = linspace(1e-4, 0.02, CONFIG.maxTimesteps);
  const ALPHAS = BETAS.map(beta => 1 - beta);
  const ALPHA_HAT = cumprod(ALPHAS);

  function updateStatus(type, message) {
    els.status.dataset.status = type;
    els.statusText.textContent = message;
  }
  function setProgress(done, total) {
    const percent = total ? Math.min(100, done / total * 100) : 0;
    els.progressBar.style.width = `${percent}%`;
    els.stepCounter.textContent = `${done} / ${total}`;
    els.progressTrack.setAttribute('aria-valuenow', String(Math.round(percent)));
  }
  function createSliders() {
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < CONFIG.latentDim; i++) {
      const row = document.createElement('div');
      row.className = 'latent-row';
      row.innerHTML = `<div class="latent-row-head"><label class="latent-name" for="latent-${i}">DIM ${String(i + 1).padStart(2,'0')}</label><output class="latent-value" id="val-${i}" for="latent-${i}">0.00</output></div><input id="latent-${i}" class="latent-range" type="range" min="-3" max="3" step="0.01" value="0" style="--percent:50%" data-index="${i}" aria-label="潜在次元 ${i + 1}">`;
      fragment.appendChild(row);
    }
    els.slidersWrapper.appendChild(fragment);
    els.slidersWrapper.addEventListener('input', e => {
      const input = e.target;
      if (input.tagName !== 'INPUT') return;
      const idx = Number(input.dataset.index);
      const value = Number(input.value);
      state.latents[idx] = value;
      document.getElementById(`val-${idx}`).textContent = value.toFixed(2);
      input.style.setProperty('--percent', `${((value + 3) / 6) * 100}%`);
    });
  }
  function setRunning(running) {
    els.generateBtn.dataset.running = String(running);
    els.generateLabel.textContent = running ? 'Stop' : 'Generate';
    els.generateIcon.className = running ? 'fa-solid fa-stop' : 'fa-solid fa-play';
  }
  function drawToCanvas(data) {
    const img = ctx.createImageData(CONFIG.imageSize, CONFIG.imageSize);
    const pixels = img.data;
    for (let i = 0; i < data.length; i++) {
      const val = Math.max(0, Math.min(255, Math.floor((data[i] + 1) * 127.5)));
      const p = i * 4;
      pixels[p] = pixels[p + 1] = pixels[p + 2] = val;
      pixels[p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  function fillCanvas(value) {
    ctx.fillStyle = `rgb(${value},${value},${value})`;
    ctx.fillRect(0, 0, CONFIG.imageSize, CONFIG.imageSize);
  }
  async function init() {
    createSliders();
    fillCanvas(0);
    els.inputSeed.value = Math.floor(Math.random() * 1000000);
    updateStatus('loading', 'モデルを読み込み中');
    try {
      if (typeof ort === 'undefined') throw new Error('ONNX Runtime Web の読み込みに失敗しました');
      try {
        state.session = await ort.InferenceSession.create(CONFIG.modelPath, { executionProviders: ['webgpu'], graphOptimizationLevel: 'all' });
        CONFIG.activeProvider = 'webgpu';
      } catch (e) {
        console.warn('WebGPU failed; falling back to WASM', e);
        state.session = await ort.InferenceSession.create(CONFIG.modelPath, { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
        CONFIG.activeProvider = 'wasm';
      }
      els.providerLabel.textContent = CONFIG.activeProvider.toUpperCase();
      els.generateBtn.disabled = false;
      els.loadingOverlay.dataset.hidden = 'true';
      updateStatus('ready', `準備完了 · ${CONFIG.activeProvider.toUpperCase()}`);
      els.message.textContent = '生成の準備ができました';
    } catch (e) {
      console.error(e);
      updateStatus('error', 'モデル読込エラー');
      els.message.textContent = `エラー: ${e.message}`;
      els.loadingOverlay.textContent = 'モデルを読み込めませんでした';
    }
  }
  function stepDDPM(x, modelOutput, t, rng) {
    const alpha = ALPHAS[t], alphaHat = ALPHA_HAT[t], beta = BETAS[t];
    const c1 = 1 / Math.sqrt(alpha), c2 = (1 - alpha) / Math.sqrt(1 - alphaHat);
    const sigma = t > 0 ? Math.sqrt(beta) : 0;
    const z = t > 0 ? randn(x.length, rng) : new Float32Array(x.length);
    const next = new Float32Array(x.length);
    for (let i = 0; i < x.length; i++) next[i] = c1 * (x[i] - c2 * modelOutput[i]) + sigma * z[i];
    return next;
  }
  function stepEulerAncestral(x, modelOutput, t, prevT, rng) {
    const alphaHatT = ALPHA_HAT[t];
    const alphaHatPrev = prevT >= 0 ? ALPHA_HAT[prevT] : 1;
    const sigmaT = Math.sqrt(1 - alphaHatT);
    const sqrtAlphaHat = Math.sqrt(alphaHatT);
    let sigmaUp = 0;
    if (prevT >= 0 && t > 0) {
      sigmaUp = Math.sqrt(((1 - alphaHatPrev) / (1 - alphaHatT)) * (1 - alphaHatT / alphaHatPrev));
    }
    const sigmaDown = Math.sqrt(Math.max(0, (1 - alphaHatPrev) - sigmaUp ** 2));
    const z = randn(x.length, rng);
    const next = new Float32Array(x.length);
    for (let i = 0; i < x.length; i++) {
      const original = (x[i] - sigmaT * modelOutput[i]) / sqrtAlphaHat;
      next[i] = Math.sqrt(alphaHatPrev) * original + sigmaDown * modelOutput[i] + sigmaUp * z[i];
    }
    return next;
  }
  async function generateImage() {
    if (state.isGenerating) { state.stopSignal = true; els.generateLabel.textContent = 'Stopping'; return; }
    if (!state.session) return;
    const sampler = els.samplerSelect.value;
    const steps = sampler === 'ddpm' ? CONFIG.maxTimesteps : Math.max(2, Math.min(1000, Math.trunc(Number(els.stepsInput.value) || 25)));
    els.stepsInput.value = String(steps);
    const mode = els.seedMode.value;
    let seed = Math.trunc(Number(els.inputSeed.value) || 0);
    if (mode === 'random') seed = Math.floor(Math.random() * 1000000000);
    state.seed = seed;
    els.inputSeed.value = String(seed);
    const rng = mulberry32(seed);
    const totalPixels = CONFIG.imageSize * CONFIG.imageSize;
    state.isGenerating = true;
    state.stopSignal = false;
    setRunning(true);
    updateStatus('busy', '生成中');
    els.message.textContent = '画像を生成しています...';
    els.infoDisplay.textContent = `Seed: ${seed}　/　Sampler: ${sampler === 'ddpm' ? 'DDPM' : 'Euler a'} · ${steps} steps`;
    setProgress(0, steps);
    let x = randn(totalPixels, rng);
    const latent = new ort.Tensor('float32', Float32Array.from(state.latents), [1, CONFIG.latentDim]);
    const timesteps = sampler === 'ddpm'
      ? Array.from({ length: CONFIG.maxTimesteps }, (_, i) => CONFIG.maxTimesteps - 1 - i)
      : Array.from({ length: steps }, (_, i) => Math.round((CONFIG.maxTimesteps - 1) - i * (CONFIG.maxTimesteps - 1) / (steps - 1)));
    const startTime = performance.now();
    try {
      for (let i = 0; i < timesteps.length; i++) {
        if (state.stopSignal) break;
        const t = timesteps[i];
        const prevT = i < timesteps.length - 1 ? timesteps[i + 1] : -1;
        const xTensor = new ort.Tensor('float32', x, [1, 1, CONFIG.imageSize, CONFIG.imageSize]);
        const tTensor = new ort.Tensor('float32', Float32Array.of(t), [1]);
        const results = await state.session.run({ input_x: xTensor, input_t: tTensor, input_latent: latent });
        const noise = results.output_noise.data;
        x = sampler === 'ddpm' ? stepDDPM(x, noise, t, rng) : stepEulerAncestral(x, noise, t, prevT, rng);
        if (steps > 50 || i % 2 === 0 || i === timesteps.length - 1) {
          setProgress(i + 1, steps);
          drawToCanvas(x);
          await new Promise(resolve => setTimeout(resolve, 0));
        }
      }
      for (let i = 0; i < totalPixels; i++) x[i] = Math.max(-1, Math.min(1, x[i]));
      drawToCanvas(x);
      if (state.stopSignal) {
        els.message.textContent = '生成を停止しました';
      } else {
        setProgress(steps, steps);
        els.message.textContent = `生成完了 · ${((performance.now() - startTime) / 1000).toFixed(1)} 秒`;
        if (mode === 'increment') els.inputSeed.value = String(seed + 1);
      }
    } catch (e) {
      console.error(e);
      els.message.textContent = `生成エラー: ${e.message}`;
    } finally {
      state.isGenerating = false;
      setRunning(false);
      updateStatus('ready', `準備完了 · ${CONFIG.activeProvider.toUpperCase()}`);
    }
  }
  els.randomBtn.addEventListener('click', () => {
    els.slidersWrapper.querySelectorAll('input[type="range"]').forEach(input => {
      input.value = (Math.random() * 4 - 2).toFixed(2);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
  });
  els.btnRollSeed.addEventListener('click', () => { els.inputSeed.value = Math.floor(Math.random() * 1000000000); });
  els.downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = `gen-${state.seed}.png`;
    link.href = els.canvas.toDataURL('image/png');
    link.click();
  });
  els.samplerSelect.addEventListener('change', () => {
    const ddpm = els.samplerSelect.value === 'ddpm';
    els.stepsInput.value = ddpm ? 1000 : 25;
    els.stepsInput.disabled = ddpm;
    els.samplerHelp.textContent = ddpm ? 'DDPM · 1000 steps 固定' : 'Steps · 25';
    setProgress(0, ddpm ? 1000 : 25);
  });
  els.stepsInput.addEventListener('change', () => {
    const steps = Math.max(2, Math.min(1000, Math.trunc(Number(els.stepsInput.value) || 25)));
    els.stepsInput.value = steps;
    els.samplerHelp.textContent = `Steps · ${steps}`;
    if (!state.isGenerating) setProgress(0, steps);
  });
  els.generateBtn.addEventListener('click', generateImage);
  els.themeBtn.addEventListener('click', () => {
    const light = document.documentElement.dataset.theme !== 'light';
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    els.themeIcon.className = light ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
    els.themeBtn.setAttribute('aria-label', light ? 'ダークテーマに切り替える' : 'ライトテーマに切り替える');
    document.querySelector('meta[name="theme-color"]').content = light ? '#ffffff' : '#151517';
  });
  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
