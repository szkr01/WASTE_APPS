<!--
Context: Interactive explorer for the PixAI Tagger v1.0 classifier head. Loads the unnormalized raw head.weight converted only from FP32 to FP16; no row normalization, quantization, or precomputed coordinates are stored. Danbooru is queried only for the selected tag gallery.
Implementation: Single-file HTML/CSS/JS app. The browser computes PCA-2 and raw-space nearest neighbors in a Web Worker directly from the FP16 weights, then renders the Canvas map with category/search filtering and Danbooru previews.
-->
<!doctype html>
<html lang="ja" class="h-full bg-[#09090b]">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>PixAI Head Explorer</title>
  <meta name="description" content="PixAI Tagger v1.0の未正規化head.weightをFP16のまま読み込み、ブラウザ内でPCA可視化と生重み空間の近傍探索を行うブラウザアプリ。">
  <meta name="page:icon" content="fas fa-circle-nodes">
  <meta name="page:color" content="#a78bfa">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script>
    tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','system-ui','sans-serif'],mono:['SFMono-Regular','Consolas','monospace']}}}};
  </script>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#0f0f12;--line:#27272f;--muted:#85858f;--ease:cubic-bezier(.23,1,.32,1)}
    *{box-sizing:border-box}html,body{margin:0;min-width:320px;height:100%;background:var(--bg);color:#f4f4f5}body{overflow:hidden}button,input,select{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
    .pressable{transition:transform 140ms var(--ease),border-color 160ms ease,background-color 160ms ease,color 160ms ease}.pressable:active{transform:scale(.97)}
    .toolbar-input{outline:none}.toolbar-input:focus{border-color:#71717a;box-shadow:0 0 0 3px rgba(161,161,170,.1)}
    .cat-btn[aria-pressed="true"]{color:#fafafa;border-color:color-mix(in srgb,var(--cat) 55%,#3f3f46);background:color-mix(in srgb,var(--cat) 13%,#111114)}
    .cat-btn[aria-pressed="false"]{color:#71717a;border-color:#27272a;background:#101012}.cat-dot{background:var(--cat)}
    #map-shell{min-width:0;min-height:0;position:relative;overflow:hidden;background:#0a0a0c}#map-canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}#map-canvas.is-dragging{cursor:grabbing}
    .canvas-overlay{pointer-events:none}.canvas-control{pointer-events:auto}.scroll-thin{scrollbar-width:thin;scrollbar-color:#33333a transparent}
    .search-popover{position:absolute;z-index:40;top:calc(100% + 6px);left:0;right:0;max-height:280px;overflow:auto;border:1px solid #2c2c34;background:rgba(15,15,18,.98);backdrop-filter:blur(18px);box-shadow:0 16px 42px rgba(0,0,0,.36)}.search-popover[hidden]{display:none}.search-result:hover,.search-result:focus-visible{background:#1a1a20;outline:none}
    .neighbor-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;width:100%;text-align:left}.similarity-track{height:2px;background:#25252c;overflow:hidden}.similarity-fill{height:100%;background:#a78bfa;transform-origin:left}
    .gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.gallery-card{position:relative;overflow:hidden;aspect-ratio:1/1;border:1px solid #24242b;background:#111115}.gallery-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 180ms var(--ease),opacity 180ms ease}.gallery-card:hover img{transform:scale(1.025)}.gallery-meta{position:absolute;inset:auto 0 0;padding:18px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.82));font-size:9px;color:#d4d4d8}
    .skeleton{background:linear-gradient(90deg,#151519 25%,#202027 50%,#151519 75%);background-size:200% 100%;animation:shimmer 1.1s linear infinite}@keyframes shimmer{to{background-position:-200% 0}}
    @media(max-width:1050px){body{overflow:auto}#app-main{height:auto!important;min-height:calc(100vh - 96px);grid-template-columns:1fr!important}#map-shell{height:62vh;min-height:420px;border-right:0!important;border-bottom:1px solid var(--line)}#inspector{height:auto!important;overflow:visible!important}.gallery-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:640px){#map-shell{height:54vh;min-height:360px}.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body class="font-sans antialiased">
  <div id="app-root" class="h-full min-h-0 flex flex-col">
    <header class="shrink-0 border-b border-zinc-800/90 bg-[#0c0c0f]">
      <div class="min-h-12 px-3 py-2 flex items-center gap-2.5 flex-wrap">
        <div class="flex items-center gap-2.5 mr-1">
          <div class="w-8 h-8 grid place-items-center border border-violet-400/25 bg-violet-400/10 text-violet-300"><i class="fas fa-circle-nodes text-sm" aria-hidden="true"></i></div>
          <div class="leading-tight"><div class="text-sm font-semibold tracking-tight">PixAI Head Explorer</div><div id="model-caption" class="text-[10px] text-zinc-500 font-mono">loading metadata…</div></div>
        </div>
        <div id="search-wrap" class="relative flex-1 min-w-[230px] max-w-xl">
          <label class="relative block"><i class="fas fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[11px] text-zinc-500" aria-hidden="true"></i><input id="tag-search" class="toolbar-input w-full h-9 pl-8 pr-16 rounded-none border border-zinc-800 bg-zinc-950/80 text-sm text-zinc-100 placeholder:text-zinc-600" type="search" autocomplete="off" spellcheck="false" placeholder="タグ検索 / hatsune_miku"><span id="visible-count" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono text-zinc-600">0</span></label>
          <div id="search-results" class="search-popover scroll-thin" hidden></div>
        </div>
        <div id="category-filter" class="flex items-center gap-1 flex-wrap" aria-label="Tag category filters"><button id="enable-all-categories" type="button" class="pressable h-8 px-2.5 border border-zinc-700 bg-zinc-900 text-[11px] text-zinc-300">all</button></div>
        <div class="ml-auto flex items-center gap-2 text-[10px] font-mono text-zinc-500"><span id="asset-status" class="inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>asset</span><a class="pressable h-8 px-2.5 border border-zinc-800 hover:border-zinc-600 hover:text-zinc-200 inline-flex items-center gap-1.5" href="https://huggingface.co/pixai-labs/pixai-tagger-v1.0" target="_blank" rel="noopener noreferrer">HF <i class="fas fa-arrow-up-right-from-square text-[9px]" aria-hidden="true"></i></a></div>
      </div>
    </header>

    <main id="app-main" class="min-h-0 flex-1 grid grid-cols-[minmax(0,1fr)_390px]" style="height:calc(100vh - 49px)">
      <section id="map-shell" class="border-r border-zinc-800/90" aria-label="Head embedding map">
        <canvas id="map-canvas" tabindex="0" aria-label="Browser-computed PCA map. Drag to pan, wheel or buttons to zoom, click a point to select a tag."></canvas>
        <div class="canvas-overlay absolute inset-x-2 top-2 flex items-start justify-between gap-2">
          <div class="px-2 py-1.5 border border-zinc-800 bg-black/65 backdrop-blur text-[10px] text-zinc-400 leading-relaxed"><span class="text-zinc-200">browser PCA-2</span><span class="mx-1 text-zinc-700">·</span><span>近傍: raw FP16 1024D Euclidean</span></div>
          <div class="canvas-control flex border border-zinc-800 bg-black/70 backdrop-blur"><button id="zoom-out" type="button" class="pressable w-8 h-8 text-zinc-400 hover:text-white" aria-label="Zoom out"><i class="fas fa-minus text-[10px]"></i></button><button id="reset-view" type="button" class="pressable w-8 h-8 border-x border-zinc-800 text-zinc-400 hover:text-white" aria-label="Fit visible points"><i class="fas fa-expand text-[10px]"></i></button><button id="zoom-in" type="button" class="pressable w-8 h-8 text-zinc-400 hover:text-white" aria-label="Zoom in"><i class="fas fa-plus text-[10px]"></i></button></div>
        </div>
        <div id="map-empty" class="canvas-overlay absolute inset-0 grid place-items-center" hidden><div class="px-4 py-3 border border-zinc-800 bg-black/75 text-sm text-zinc-500">フィルタに一致するタグがないのだ</div></div>
        <div id="map-tooltip" class="canvas-overlay absolute hidden px-2 py-1 border border-zinc-700 bg-black/90 text-[10px] text-zinc-100 font-mono whitespace-nowrap"></div>
      </section>

      <aside id="inspector" class="min-h-0 h-full overflow-y-auto scroll-thin bg-[#0d0d10]">
        <section class="border-b border-zinc-800 p-3">
          <div class="flex items-start gap-2"><div class="min-w-0 flex-1"><div class="flex items-center gap-2 flex-wrap"><h1 id="selected-tag" class="text-base font-semibold tracking-tight break-all">—</h1><span id="selected-category" class="px-1.5 py-0.5 border border-zinc-700 text-[9px] font-mono text-zinc-400">—</span></div><div class="mt-1 flex items-center gap-3 text-[10px] font-mono text-zinc-500"><span>index <b id="selected-index" class="font-normal text-zinc-300">—</b></span><span>weight norm <b id="selected-weight-norm" class="font-normal text-zinc-300">—</b></span></div></div><button id="focus-selected" type="button" class="pressable w-8 h-8 shrink-0 border border-zinc-800 text-zinc-500 hover:border-zinc-600 hover:text-white" aria-label="Center selected tag on map"><i class="fas fa-crosshairs text-xs"></i></button></div>
          <div class="mt-2 flex gap-1.5"><button id="copy-tag" type="button" class="pressable h-8 px-2.5 border border-zinc-800 text-[11px] text-zinc-400 hover:text-white hover:border-zinc-600"><i class="far fa-copy mr-1.5"></i>copy</button><a id="open-danbooru" href="https://danbooru.donmai.us" target="_blank" rel="noopener noreferrer" class="pressable h-8 px-2.5 border border-zinc-800 text-[11px] text-zinc-400 hover:text-white hover:border-zinc-600 inline-flex items-center"><i class="fas fa-images mr-1.5"></i>Danbooru ↗</a></div>
        </section>
        <section class="border-b border-zinc-800"><div class="h-9 px-3 flex items-center justify-between border-b border-zinc-800/70 bg-zinc-950/30"><h2 class="text-[11px] font-semibold uppercase tracking-[.12em] text-zinc-400">Nearest tags</h2><span id="neighbor-status" class="text-[9px] font-mono text-zinc-600">—</span></div><div id="neighbor-list" class="divide-y divide-zinc-800/70"></div></section>
        <section><div class="min-h-10 px-3 py-1.5 flex items-center gap-2 border-b border-zinc-800/70 bg-zinc-950/30 sticky top-0 z-10"><h2 class="text-[11px] font-semibold uppercase tracking-[.12em] text-zinc-400 mr-auto">Danbooru preview</h2><label class="text-[9px] text-zinc-600" for="gallery-rating">rating</label><select id="gallery-rating" class="h-7 border border-zinc-800 bg-zinc-950 px-1.5 text-[10px] text-zinc-300 outline-none"><option value="g" selected>g</option><option value="s">s</option><option value="q">q</option><option value="e">e</option><option value="any">any</option></select><button id="refresh-gallery" type="button" class="pressable w-7 h-7 border border-zinc-800 text-zinc-500 hover:text-white" aria-label="Refresh gallery"><i class="fas fa-rotate text-[9px]"></i></button></div><div id="gallery-status" class="px-3 py-2 text-[10px] text-zinc-600">タグを選択すると取得するのだ</div><div id="gallery" class="gallery-grid p-2 pt-0"></div></section>
      </aside>
    </main>
  </div>

  <script>
  (()=>{
    'use strict';
    const CONFIG_URL='https://huggingface.co/pixai-labs/pixai-tagger-v1.0/resolve/main/config.json',BIN_URL='../Assets/pixai_head_weight_fp16.bin',DANBOORU_API='https://danbooru.donmai.us/posts.json';
    const CATEGORY_META={general:{color:'#94a3b8'},character:{color:'#22d3ee'},copyright:{color:'#a78bfa'},style:{color:'#f472b6'},meta:{color:'#f59e0b'},rating:{color:'#ef4444'}};
    const $=id=>document.getElementById(id);
    const els={search:$('tag-search'),searchWrap:$('search-wrap'),searchResults:$('search-results'),visibleCount:$('visible-count'),categoryFilter:$('category-filter'),allCategories:$('enable-all-categories'),assetStatus:$('asset-status'),modelCaption:$('model-caption'),mapShell:$('map-shell'),canvas:$('map-canvas'),tooltip:$('map-tooltip'),mapEmpty:$('map-empty'),zoomIn:$('zoom-in'),zoomOut:$('zoom-out'),resetView:$('reset-view'),selectedTag:$('selected-tag'),selectedCategory:$('selected-category'),selectedIndex:$('selected-index'),selectedWeightNorm:$('selected-weight-norm'),focusSelected:$('focus-selected'),copyTag:$('copy-tag'),openDanbooru:$('open-danbooru'),neighborStatus:$('neighbor-status'),neighborList:$('neighbor-list'),galleryRating:$('gallery-rating'),refreshGallery:$('refresh-gallery'),galleryStatus:$('gallery-status'),gallery:$('gallery')};
    const state={meta:null,positions:null,weightNorm:null,normPositions:null,categoryIndex:null,enabledCategories:new Set(),visible:[],selected:-1,neighbors:[],hover:-1,searchQuery:'',view:{x:0,y:0,zoom:1},dpr:1,worker:null,workerReady:false,nearestRequest:0,galleryAbort:null,galleryTimer:0,galleryCache:new Map(),drawPending:false,pointer:{down:false,id:-1,x:0,y:0,moved:false}};

    function escapeHtml(v){return String(v).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
    function setAssetStatus(text,mode='loading'){const color=mode==='ready'?'bg-emerald-400':mode==='error'?'bg-red-400':'bg-amber-400';els.assetStatus.innerHTML=`<span class="w-1.5 h-1.5 rounded-full ${color}"></span>${escapeHtml(text)}`;}
    function categoryForIndex(index){if(!state.categoryIndex||index<0)return null;return state.meta.categories[state.categoryIndex[index]];}
    function buildCategoryIndex(){state.categoryIndex=new Uint8Array(state.meta.count);state.meta.categories.forEach((cat,id)=>{state.categoryIndex.fill(id,cat.offset,cat.offset+cat.count);state.enabledCategories.add(id);});}
    function renderCategoryButtons(){els.categoryFilter.querySelectorAll('[data-cat-id]').forEach(el=>el.remove());state.meta.categories.forEach((cat,id)=>{const info=CATEGORY_META[cat.name]||{color:'#a1a1aa'};const b=document.createElement('button');b.type='button';b.className='cat-btn pressable h-8 px-2 border text-[10px] inline-flex items-center gap-1.5';b.dataset.catId=String(id);b.style.setProperty('--cat',info.color);b.setAttribute('aria-pressed','true');b.innerHTML=`<span class="cat-dot w-1.5 h-1.5 rounded-full"></span><span>${escapeHtml(cat.name)}</span><span class="text-zinc-600 font-mono">${cat.count.toLocaleString()}</span>`;b.addEventListener('click',()=>toggleCategory(id,b));els.categoryFilter.append(b);});updateAllCategoryButton();}
    function toggleCategory(id,b){state.enabledCategories.has(id)?state.enabledCategories.delete(id):state.enabledCategories.add(id);b.setAttribute('aria-pressed',String(state.enabledCategories.has(id)));updateAllCategoryButton();updateVisible();requestNeighbors();}
    function updateAllCategoryButton(){const all=state.meta&&state.enabledCategories.size===state.meta.categories.length;els.allCategories.classList.toggle('border-violet-400/50',!!all);els.allCategories.classList.toggle('text-violet-200',!!all);}

    function scaleMapPositions(){const n=state.meta.count,xs=new Float32Array(n),ys=new Float32Array(n);for(let i=0;i<n;i++){xs[i]=state.positions[i*2];ys[i]=state.positions[i*2+1];}xs.sort();ys.sort();const lo=Math.floor(n*.005),hi=Math.floor(n*.995),x0=xs[lo],x1=xs[hi],y0=ys[lo],y1=ys[hi],cx=(x0+x1)*.5,cy=(y0+y1)*.5,sx=Math.max((x1-x0)*.5,1e-9),sy=Math.max((y1-y0)*.5,1e-9);state.normPositions=new Float32Array(n*2);for(let i=0;i<n;i++){state.normPositions[i*2]=Math.max(-2.8,Math.min(2.8,(state.positions[i*2]-cx)/sx));state.normPositions[i*2+1]=Math.max(-2.8,Math.min(2.8,(state.positions[i*2+1]-cy)/sy));}}
    function updateVisible(){if(!state.meta)return;const q=state.searchQuery.trim().toLowerCase(),v=[];for(let i=0;i<state.meta.count;i++){if(!state.enabledCategories.has(state.categoryIndex[i]))continue;if(q&&!state.meta.tags[i].toLowerCase().includes(q))continue;v.push(i);}state.visible=v;els.visibleCount.textContent=v.length.toLocaleString();els.mapEmpty.hidden=v.length!==0;scheduleDraw();}
    function fitVisible(){if(!state.visible.length||!state.normPositions)return;let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const i of state.visible){const x=state.normPositions[i*2],y=state.normPositions[i*2+1];if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}const rx=Math.max(maxX-minX,.05),ry=Math.max(maxY-minY,.05);state.view.x=(minX+maxX)*.5;state.view.y=(minY+maxY)*.5;state.view.zoom=Math.min(45,Math.max(.32,Math.min(1.86/rx,1.86/ry)));scheduleDraw();}
    function resizeCanvas(){const r=els.mapShell.getBoundingClientRect();state.dpr=Math.min(window.devicePixelRatio||1,2);els.canvas.width=Math.max(1,Math.round(r.width*state.dpr));els.canvas.height=Math.max(1,Math.round(r.height*state.dpr));els.canvas.style.width=`${r.width}px`;els.canvas.style.height=`${r.height}px`;scheduleDraw();}
    function mapMetrics(){const r=els.canvas.getBoundingClientRect();return{width:r.width,height:r.height,base:Math.max(80,Math.min(r.width,r.height)*.47)};}
    function worldToScreen(x,y,m=mapMetrics()){return{x:(x-state.view.x)*m.base*state.view.zoom+m.width*.5,y:(y-state.view.y)*m.base*state.view.zoom+m.height*.5};}
    function screenToWorld(x,y,m=mapMetrics()){return{x:(x-m.width*.5)/(m.base*state.view.zoom)+state.view.x,y:(y-m.height*.5)/(m.base*state.view.zoom)+state.view.y};}
    function scheduleDraw(){if(state.drawPending)return;state.drawPending=true;requestAnimationFrame(()=>{state.drawPending=false;drawMap();});}
    function drawMap(){if(!state.normPositions)return;const ctx=els.canvas.getContext('2d'),m=mapMetrics(),dpr=state.dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,m.width,m.height);ctx.fillStyle='#0a0a0c';ctx.fillRect(0,0,m.width,m.height);ctx.strokeStyle='#18181d';ctx.lineWidth=1;const step=m.base*state.view.zoom*.5;if(step>22){const c=worldToScreen(0,0,m);ctx.beginPath();for(let x=((c.x%step)+step)%step;x<m.width;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,m.height);}for(let y=((c.y%step)+step)%step;y<m.height;y+=step){ctx.moveTo(0,y);ctx.lineTo(m.width,y);}ctx.stroke();}const near=new Set(state.neighbors.map(n=>n.index)),size=state.view.zoom>5?2.2:state.view.zoom>2?1.7:1.2;for(const i of state.visible){const p=worldToScreen(state.normPositions[i*2],state.normPositions[i*2+1],m);if(p.x<-4||p.x>m.width+4||p.y<-4||p.y>m.height+4)continue;const cat=categoryForIndex(i),info=CATEGORY_META[cat.name]||{color:'#a1a1aa'};ctx.globalAlpha=near.has(i)?.98:.46;ctx.fillStyle=near.has(i)?'#e9d5ff':info.color;ctx.fillRect(p.x-size*.5,p.y-size*.5,size,size);}ctx.globalAlpha=1;if(state.selected>=0){const p=worldToScreen(state.normPositions[state.selected*2],state.normPositions[state.selected*2+1],m);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#fff';ctx.font='11px SFMono-Regular,Consolas,monospace';ctx.fillText(state.meta.tags[state.selected],p.x+9,p.y-8);}if(state.view.zoom>2.2){ctx.font='9px SFMono-Regular,Consolas,monospace';ctx.fillStyle='#d4d4d8';for(const n of state.neighbors.slice(0,8)){const p=worldToScreen(state.normPositions[n.index*2],state.normPositions[n.index*2+1],m);if(p.x>0&&p.x<m.width-90&&p.y>10&&p.y<m.height-5)ctx.fillText(state.meta.tags[n.index],p.x+5,p.y-3);}}}
    function findPointAt(clientX,clientY,radius=10){const rect=els.canvas.getBoundingClientRect(),m=mapMetrics(),x=clientX-rect.left,y=clientY-rect.top;let best=-1,bestD2=radius*radius;for(const i of state.visible){const p=worldToScreen(state.normPositions[i*2],state.normPositions[i*2+1],m),dx=p.x-x,dy=p.y-y,d2=dx*dx+dy*dy;if(d2<bestD2){bestD2=d2;best=i;}}return best;}
    function showTooltip(index,clientX,clientY){if(index<0){els.tooltip.classList.add('hidden');return;}const rect=els.mapShell.getBoundingClientRect(),cat=categoryForIndex(index);els.tooltip.textContent=`${state.meta.tags[index]} · ${cat.name}`;els.tooltip.style.left=`${Math.min(rect.width-180,Math.max(6,clientX-rect.left+12))}px`;els.tooltip.style.top=`${Math.min(rect.height-32,Math.max(44,clientY-rect.top+12))}px`;els.tooltip.classList.remove('hidden');}
    function centerOnSelected(){if(state.selected<0)return;state.view.x=state.normPositions[state.selected*2];state.view.y=state.normPositions[state.selected*2+1];state.view.zoom=Math.max(state.view.zoom,5.5);scheduleDraw();}
    function setZoom(next,anchor=null){const old=state.view.zoom,clamped=Math.max(.25,Math.min(60,next));if(Math.abs(old-clamped)<1e-6)return;if(anchor){const rect=els.canvas.getBoundingClientRect(),sx=anchor.x-rect.left,sy=anchor.y-rect.top,before=screenToWorld(sx,sy);state.view.zoom=clamped;const after=screenToWorld(sx,sy);state.view.x+=before.x-after.x;state.view.y+=before.y-after.y;}else state.view.zoom=clamped;scheduleDraw();}

    function renderSearchResults(){const q=state.searchQuery.trim().toLowerCase();if(!q||!state.meta){els.searchResults.hidden=true;els.searchResults.replaceChildren();return;}const exact=[],prefix=[],contains=[];for(let i=0;i<state.meta.count;i++){const tag=state.meta.tags[i].toLowerCase();if(tag===q)exact.push(i);else if(tag.startsWith(q)&&prefix.length<10)prefix.push(i);else if(tag.includes(q)&&contains.length<10)contains.push(i);}const matches=[...exact,...prefix,...contains].slice(0,10);els.searchResults.replaceChildren(...matches.map(index=>{const cat=categoryForIndex(index),info=CATEGORY_META[cat.name]||{color:'#a1a1aa'},b=document.createElement('button');b.type='button';b.className='search-result w-full px-2.5 py-2 flex items-center gap-2 text-left';b.innerHTML=`<span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${info.color}"></span><span class="min-w-0 flex-1 text-xs text-zinc-200 font-mono truncate">${escapeHtml(state.meta.tags[index])}</span><span class="text-[9px] text-zinc-600">${escapeHtml(cat.name)}</span>`;b.addEventListener('click',()=>{selectTag(index,true);els.searchResults.hidden=true;});return b;}));els.searchResults.hidden=matches.length===0;}
    function updateSelectedPanel(){if(state.selected<0)return;const tag=state.meta.tags[state.selected],cat=categoryForIndex(state.selected),info=CATEGORY_META[cat.name]||{color:'#a1a1aa'};els.selectedTag.textContent=tag;els.selectedCategory.textContent=cat.name;els.selectedCategory.style.borderColor=info.color+'66';els.selectedCategory.style.color=info.color;els.selectedIndex.textContent=state.selected.toLocaleString();els.selectedWeightNorm.textContent=state.weightNorm?Number(state.weightNorm[state.selected]).toFixed(5):'—';updateDanbooruLink();}
    function selectTag(index,focus=false){if(!state.meta||index<0||index>=state.meta.count)return;state.selected=index;state.neighbors=[];updateSelectedPanel();focus?centerOnSelected():scheduleDraw();requestNeighbors();scheduleGallery();}

    function createNeighborWorker(){
      const source=`let emb=null,count=0,dim=0,catIndex=null,lut=null;
function makeHalfLut(){const out=new Float32Array(65536);for(let h=0;h<65536;h++){const sign=(h&32768)?-1:1,e=(h>>>10)&31,f=h&1023;if(e===0)out[h]=sign*Math.pow(2,-14)*(f/1024);else if(e===31)out[h]=f?NaN:sign*Infinity;else out[h]=sign*Math.pow(2,e-15)*(1+f/1024)}return out}
function normalizeVector(v,orth=null){if(orth){let d=0;for(let k=0;k<dim;k++)d+=v[k]*orth[k];for(let k=0;k<dim;k++)v[k]-=d*orth[k]}let n=0;for(let k=0;k<dim;k++)n+=v[k]*v[k];n=Math.sqrt(n)||1;for(let k=0;k<dim;k++)v[k]/=n;return v}
function seededVector(seed){let x=seed>>>0,v=new Float64Array(dim);for(let k=0;k<dim;k++){x^=x<<13;x^=x>>>17;x^=x<<5;v[k]=((x>>>0)/4294967296)-.5}return normalizeVector(v)}
function computePca(){const sampleCount=Math.min(4096,count),sampleRows=new Uint32Array(sampleCount),mean=new Float64Array(dim);for(let s=0;s<sampleCount;s++)sampleRows[s]=sampleCount===1?0:Math.floor(s*(count-1)/(sampleCount-1));self.postMessage({type:'progress',text:'PCA mean'});for(let s=0;s<sampleCount;s++){let o=sampleRows[s]*dim;for(let k=0;k<dim;k++)mean[k]+=lut[emb[o+k]]}for(let k=0;k<dim;k++)mean[k]/=sampleCount;
function covStep(v,orth){const y=new Float64Array(dim);for(let s=0;s<sampleCount;s++){let o=sampleRows[s]*dim,dot=0;for(let k=0;k<dim;k++)dot+=(lut[emb[o+k]]-mean[k])*v[k];for(let k=0;k<dim;k++)y[k]+=(lut[emb[o+k]]-mean[k])*dot}return normalizeVector(y,orth)}
let pc1=seededVector(0x51f15e),pc2=seededVector(0x9e3779b9);for(let it=0;it<5;it++){self.postMessage({type:'progress',text:'PCA PC1 '+(it+1)+'/5'});pc1=covStep(pc1,null)}pc2=normalizeVector(pc2,pc1);for(let it=0;it<5;it++){self.postMessage({type:'progress',text:'PCA PC2 '+(it+1)+'/5'});pc2=covStep(pc2,pc1)}
self.postMessage({type:'progress',text:'projecting 30,877 rows'});const positions=new Float32Array(count*2),norms=new Float32Array(count);for(let i=0;i<count;i++){let o=i*dim,a=0,b=0,n=0;for(let k=0;k<dim;k++){const raw=lut[emb[o+k]],c=raw-mean[k];a+=c*pc1[k];b+=c*pc2[k];n+=raw*raw}positions[i*2]=a;positions[i*2+1]=b;norms[i]=Math.sqrt(n)}self.postMessage({type:'ready',positions:positions.buffer,norms:norms.buffer,sampleCount},[positions.buffer,norms.buffer])}
self.onmessage=e=>{const d=e.data;if(d.type==='init'){emb=new Uint16Array(d.buffer);count=d.count;dim=d.dim;catIndex=new Uint8Array(count);for(let c=0;c<d.categories.length;c++){const r=d.categories[c];catIndex.fill(c,r.offset,r.offset+r.count)}lut=makeHalfLut();computePca();return}if(d.type==='neighbors'&&emb){const qi=d.index,qoff=qi*dim,enabled=d.enabled,limit=d.limit||24,top=[];for(let i=0;i<count;i++){if(i===qi||!enabled[catIndex[i]])continue;let d2=0,o=i*dim,cutoff=top.length===limit?top[0].d2:Infinity;for(let k=0;k<dim;k++){const delta=lut[emb[qoff+k]]-lut[emb[o+k]];d2+=delta*delta;if(d2>cutoff)break}if(d2>cutoff)continue;if(top.length<limit){top.push({index:i,d2});if(top.length===limit)top.sort((a,b)=>b.d2-a.d2)}else if(d2<top[0].d2){top[0]={index:i,d2};top.sort((a,b)=>b.d2-a.d2)}}top.sort((a,b)=>a.d2-b.d2);self.postMessage({type:'neighbors',requestId:d.requestId,index:qi,items:top.map(x=>({index:x.index,distance:Math.sqrt(x.d2)}))})}};`;
      const url=URL.createObjectURL(new Blob([source],{type:'application/javascript'})),worker=new Worker(url);URL.revokeObjectURL(url);
      worker.onmessage=e=>{const d=e.data;if(d.type==='progress'){setAssetStatus(d.text,'loading');els.modelCaption.textContent=`${state.meta.count.toLocaleString()} tags · raw FP16 · ${d.text}`;return}if(d.type==='ready'){state.positions=new Float32Array(d.positions);state.weightNorm=new Float32Array(d.norms);scaleMapPositions();state.workerReady=true;setAssetStatus('raw FP16 ready','ready');els.modelCaption.textContent=`${state.meta.count.toLocaleString()} tags · 1024D raw FP16 · PCA in browser`;fitVisible();const defaultIndex=state.meta.tags.indexOf('hatsune_miku');selectTag(defaultIndex>=0?defaultIndex:0,false);return}if(d.type==='neighbors'&&d.requestId===state.nearestRequest&&d.index===state.selected){state.neighbors=d.items;renderNeighbors();scheduleDraw();}};
      worker.onerror=e=>{console.error(e);els.neighborStatus.textContent='worker error';setAssetStatus('worker error','error');};state.worker=worker;
    }
    function requestNeighbors(){if(state.selected<0)return;if(!state.workerReady){els.neighborStatus.textContent='preparing…';return;}const enabled=state.meta.categories.map((_,id)=>state.enabledCategories.has(id)?1:0),requestId=++state.nearestRequest;els.neighborStatus.textContent='searching…';state.worker.postMessage({type:'neighbors',requestId,index:state.selected,enabled,limit:24});}
    function renderNeighbors(){const maxDistance=state.neighbors.length?Math.max(state.neighbors[state.neighbors.length-1].distance,1e-12):1;els.neighborStatus.textContent=`${state.neighbors.length} hits`;els.neighborList.replaceChildren(...state.neighbors.map((n,rank)=>{const cat=categoryForIndex(n.index),info=CATEGORY_META[cat.name]||{color:'#a1a1aa'},b=document.createElement('button'),distance=Math.max(0,n.distance),closeness=Math.max(0,1-distance/maxDistance);b.type='button';b.className='neighbor-row pressable px-3 py-2 hover:bg-zinc-900/70';b.innerHTML=`<div class="min-w-0"><div class="flex items-center gap-2"><span class="text-[9px] text-zinc-700 font-mono w-4">${rank+1}</span><span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${info.color}"></span><span class="text-[11px] font-mono text-zinc-200 truncate">${escapeHtml(state.meta.tags[n.index])}</span></div><div class="similarity-track mt-1.5 ml-6"><div class="similarity-fill" style="width:${closeness*100}%"></div></div></div><div class="text-[10px] font-mono text-zinc-500 self-center">${distance.toFixed(4)}</div>`;b.addEventListener('click',()=>selectTag(n.index,false));return b;}));}

    function galleryQuery(){if(state.selected<0)return'';const tag=state.meta.tags[state.selected],rating=els.galleryRating.value;if(rating==='any'||/^rating:/.test(tag))return tag;return`${tag} rating:${rating}`;}
    function updateDanbooruLink(){const q=galleryQuery();els.openDanbooru.href=q?`https://danbooru.donmai.us/posts?tags=${encodeURIComponent(q)}`:'https://danbooru.donmai.us';}
    function scheduleGallery(force=false){clearTimeout(state.galleryTimer);updateDanbooruLink();state.galleryTimer=setTimeout(()=>loadGallery(force),force?0:220);}
    function galleryImageUrl(post){const v=post.media_asset?.variants||[];return v.find(x=>x.type==='360x360')?.url||v.find(x=>x.type==='180x180')?.url||post.preview_file_url||null;}
    function renderGallery(posts){if(!posts.length){els.gallery.replaceChildren();els.galleryStatus.textContent='該当投稿なし';return;}els.galleryStatus.textContent=`${posts.length} posts · ${galleryQuery()}`;els.gallery.replaceChildren(...posts.map(post=>{const href=`https://danbooru.donmai.us/posts/${post.id}`,img=galleryImageUrl(post),artist=(post.tag_string_artist||'').split(' ').filter(Boolean).slice(0,2).join(', '),a=document.createElement('a');a.className='gallery-card';a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.title=artist||`Danbooru #${post.id}`;a.innerHTML=img?`<img src="${escapeHtml(img)}" alt="Danbooru post ${post.id}" loading="lazy" decoding="async" referrerpolicy="no-referrer"><div class="gallery-meta"><div class="truncate">${escapeHtml(artist||'unknown artist')}</div><div class="text-zinc-500">#${post.id} · score ${post.score??0}</div></div>`:'<div class="w-full h-full grid place-items-center text-zinc-700 text-xs">no preview</div>';return a;}));}
    async function loadGallery(force=false){if(state.selected<0)return;const query=galleryQuery(),key=query;if(!force&&state.galleryCache.has(key)){renderGallery(state.galleryCache.get(key));return;}if(state.galleryAbort)state.galleryAbort.abort();state.galleryAbort=new AbortController();els.galleryStatus.textContent=`loading · ${query}`;els.gallery.replaceChildren(...Array.from({length:9},()=>{const d=document.createElement('div');d.className='gallery-card skeleton';return d;}));try{const response=await fetch(`${DANBOORU_API}?tags=${encodeURIComponent(query)}&limit=24`,{signal:state.galleryAbort.signal,headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`Danbooru ${response.status}`);const posts=await response.json();if(!Array.isArray(posts))throw new Error('Unexpected Danbooru response');state.galleryCache.set(key,posts);renderGallery(posts);}catch(error){if(error.name==='AbortError')return;console.error(error);els.gallery.replaceChildren();els.galleryStatus.textContent=`取得失敗: ${error.message}`;}}
    async function copySelectedTag(){if(state.selected<0)return;const text=state.meta.tags[state.selected];try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();document.execCommand('copy');ta.remove()}const old=els.copyTag.innerHTML;els.copyTag.innerHTML='<i class="fas fa-check mr-1.5"></i>copied';setTimeout(()=>{els.copyTag.innerHTML=old},700);}

    function bindEvents(){els.search.addEventListener('input',()=>{state.searchQuery=els.search.value;updateVisible();renderSearchResults()});els.search.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.meta){const q=els.search.value.trim().toLowerCase();let index=state.meta.tags.findIndex(t=>t.toLowerCase()===q);if(index<0)index=state.visible[0]??-1;if(index>=0){e.preventDefault();selectTag(index,true);els.searchResults.hidden=true}}if(e.key==='Escape'){els.search.value='';state.searchQuery='';updateVisible();renderSearchResults()}});document.addEventListener('pointerdown',e=>{if(!e.composedPath().includes(els.searchWrap))els.searchResults.hidden=true});els.allCategories.addEventListener('click',()=>{if(!state.meta)return;state.enabledCategories=new Set(state.meta.categories.map((_,i)=>i));els.categoryFilter.querySelectorAll('[data-cat-id]').forEach(b=>b.setAttribute('aria-pressed','true'));updateAllCategoryButton();updateVisible();requestNeighbors()});els.zoomIn.addEventListener('click',()=>setZoom(state.view.zoom*1.35));els.zoomOut.addEventListener('click',()=>setZoom(state.view.zoom/1.35));els.resetView.addEventListener('click',fitVisible);els.focusSelected.addEventListener('click',centerOnSelected);els.copyTag.addEventListener('click',copySelectedTag);els.galleryRating.addEventListener('change',()=>scheduleGallery(false));els.refreshGallery.addEventListener('click',()=>scheduleGallery(true));els.canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(state.view.zoom*Math.exp(-e.deltaY*.0012),{x:e.clientX,y:e.clientY})},{passive:false});els.canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;state.pointer={down:true,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};els.canvas.setPointerCapture(e.pointerId);els.canvas.classList.add('is-dragging')});els.canvas.addEventListener('pointermove',e=>{if(state.pointer.down&&e.pointerId===state.pointer.id){const dx=e.clientX-state.pointer.x,dy=e.clientY-state.pointer.y;if(Math.abs(dx)+Math.abs(dy)>2)state.pointer.moved=true;const m=mapMetrics();state.view.x-=dx/(m.base*state.view.zoom);state.view.y-=dy/(m.base*state.view.zoom);state.pointer.x=e.clientX;state.pointer.y=e.clientY;scheduleDraw();return;}const index=findPointAt(e.clientX,e.clientY,8);state.hover=index;showTooltip(index,e.clientX,e.clientY)});els.canvas.addEventListener('pointerup',e=>{if(!state.pointer.down||e.pointerId!==state.pointer.id)return;const moved=state.pointer.moved;state.pointer.down=false;els.canvas.classList.remove('is-dragging');try{els.canvas.releasePointerCapture(e.pointerId)}catch{}if(!moved){const index=findPointAt(e.clientX,e.clientY,11);if(index>=0)selectTag(index,false)}});els.canvas.addEventListener('pointercancel',()=>{state.pointer.down=false;els.canvas.classList.remove('is-dragging')});els.canvas.addEventListener('pointerleave',()=>{if(!state.pointer.down){state.hover=-1;els.tooltip.classList.add('hidden')}});els.canvas.addEventListener('dblclick',e=>{const index=findPointAt(e.clientX,e.clientY,12);index>=0?selectTag(index,true):fitVisible()});new ResizeObserver(resizeCanvas).observe(els.mapShell);}

    async function loadAssets(){setAssetStatus('HF config','loading');const mr=await fetch(CONFIG_URL,{cache:'no-store'});if(!mr.ok)throw new Error(`config ${mr.status}`);const cfg=await mr.json();if(!Array.isArray(cfg.tags)||!Array.isArray(cfg.tags_split))throw new Error('invalid PixAI config');let offset=0;const categories=cfg.tags_split.map(([name,count])=>{const item={name,offset,count};offset+=count;return item;});state.meta={source:'pixai-labs/pixai-tagger-v1.0',count:cfg.tags.length,originalDim:1024,categories,tags:cfg.tags};buildCategoryIndex();renderCategoryButtons();updateVisible();els.modelCaption.textContent=`${state.meta.count.toLocaleString()} tags · 1024D head · loading raw FP16`;setAssetStatus('63.2 MB FP16','loading');const br=await fetch(BIN_URL);if(!br.ok)throw new Error(`asset ${br.status}`);const buffer=await br.arrayBuffer(),expected=state.meta.count*state.meta.originalDim*2;if(buffer.byteLength!==expected)throw new Error(`FP16 size mismatch: ${buffer.byteLength} / ${expected}`);createNeighborWorker();setAssetStatus('browser PCA','loading');state.worker.postMessage({type:'init',buffer,count:state.meta.count,dim:state.meta.originalDim,categories:state.meta.categories},[buffer]);}
    async function init(){bindEvents();resizeCanvas();try{await loadAssets()}catch(error){console.error(error);setAssetStatus('load failed','error');els.modelCaption.textContent=error.message;els.galleryStatus.textContent='アセット読み込み失敗';}}
    init();
  })();
  </script>
