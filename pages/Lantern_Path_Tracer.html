<script>
// Infinite integer lattice, ray-traced analytically via 3D DDA. No meshes, impostors, or finite scene population.
(()=>{
'use strict';
const canvas=document.getElementById('scene');
const stats=document.getElementById('statsText');
const panel=document.getElementById('settingsPanel');
const settingsButton=document.getElementById('settingsButton');
const errorMessage=document.getElementById('errorMessage');
const settings={quality:.60,lod:1.2,bounces:2,samples:256,denoise:.8,spacing:4,size:1,fov:86,exposure:.25,bloom:.55,fog:.7,drift:false};
const home={pos:[1.05,.35,2.0],yaw:-.18,pitch:.36};
let position=home.pos.slice(),yaw=home.yaw,pitch=home.pitch;
let gl,programTrace,programDisplay,targets=[],targetIndex=0,frame=0,dirty=true,pixelWidth=1,pixelHeight=1,locTrace={},locDisplay={};
let lastTime=0,moving=false,dragging=false,lastPointer=[0,0],fps=0,framesForFps=0,fpsTime=0,canRender=true;
const keys=new Set();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const get=id=>document.getElementById(id);
function fail(message){canRender=false;errorMessage.textContent=message;get('unsupported').classList.add('visible');stats.textContent='WEBGL2 UNAVAILABLE';}
gl=canvas.getContext('webgl2',{alpha:false,depth:false,stencil:false,antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
if(!gl){fail('このページにはWebGL2対応ブラウザとGPUアクセラレーションが必要です。');return;}
const colorFloat=!!gl.getExtension('EXT_color_buffer_float');
const vertexSource=`#version 300 es
precision highp float;
out vec2 vUv;
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const traceSource=`#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uHistory;
uniform vec2 uResolution;
uniform mat3 uBasis;
uniform vec3 uEye;
uniform int uFrame;
uniform float uPixelLod;
uniform int uBounces;
uniform float uSpacing;
uniform float uSize;
uniform float uTanHalfFov;
uniform float uFog;
uniform bool uPacked;
const float FAR=1.e8;
const float PI=3.141592653589793;
uint state;
float rand(){state^=state<<13;state^=state>>17;state^=state<<5;return float(state)*2.3283064365386963e-10;}
float hashCell(vec3 c){return fract(sin(dot(c,vec3(127.1,311.7,74.7)))*43758.5453);}
struct Hit{float t;vec3 n;vec3 local;vec3 cell;int mat;};
Hit emptyHit(){Hit h;h.t=FAR;h.n=vec3(0.,1.,0.);h.local=vec3(0.);h.cell=vec3(0.);h.mat=0;return h;}
vec3 safeInv(vec3 d){return 1./vec3(abs(d.x)<1.e-7?1.e-7:d.x,abs(d.y)<1.e-7?1.e-7:d.y,abs(d.z)<1.e-7?1.e-7:d.z);}
bool intervalBox(vec3 o,vec3 invD,vec3 center,vec3 halfSize,out float entry,out float exitT){
  vec3 a=(center-halfSize-o)*invD;
  vec3 b=(center+halfSize-o)*invD;
  vec3 lo=min(a,b),hi=max(a,b);
  entry=max(max(lo.x,lo.y),lo.z);
  exitT=min(min(hi.x,hi.y),hi.z);
  return exitT>=max(entry,0.)&&exitT>0.;
}
void addBox(vec3 o,vec3 d,vec3 invD,vec3 center,vec3 halfSize,int material,inout Hit hit){
  float nearT,farT;
  if(!intervalBox(o,invD,center,halfSize,nearT,farT))return;
  float t=nearT>.0006?nearT:farT;
  if(t>=hit.t||t<=.0006)return;
  vec3 p=o+d*t-center;
  vec3 f=abs(p/max(halfSize,vec3(.0001)));
  vec3 n;
  if(f.x>f.y&&f.x>f.z)n=vec3(sign(p.x),0.,0.);
  else if(f.y>f.z)n=vec3(0.,sign(p.y),0.);
  else n=vec3(0.,0.,sign(p.z));
  hit.t=t;hit.n=n;hit.local=o+d*t;hit.mat=material;
}
void lantern(vec3 o,vec3 d,vec3 invD,inout Hit h){
  // Four illuminated glass faces and metal cap/floor. The two lit windows on each face
  // are physically separated by thin dark bars; the object is not a camera-facing quad.
  addBox(o,d,invD,vec3(0.,-.065,0.),vec3(.365,.305,.365),2,h);
  addBox(o,d,invD,vec3(0., .296,0.),vec3(.475,.070,.478),1,h);
  addBox(o,d,invD,vec3(0.,-.427,0.),vec3(.455,.090,.462),1,h);
  // Bronze corner uprights.
  for(int a=0;a<2;a++)for(int b=0;b<2;b++){
    float x=a==0?-.411:.411;
    float z=b==0?-.411:.411;
    addBox(o,d,invD,vec3(x,-.059,z),vec3(.059,.314,.060),1,h);
  }
  // Window mullions: real narrow solid bars, not a screen-space texture.
  for(int s=0;s<2;s++){
    float q=s==0?-.38:.38;
    addBox(o,d,invD,vec3(0.,-.055,q),vec3(.023,.300,.023),1,h);
    addBox(o,d,invD,vec3(0.,-.065,q),vec3(.367,.022,.023),1,h);
    addBox(o,d,invD,vec3(q,-.055,0.),vec3(.023,.300,.023),1,h);
    addBox(o,d,invD,vec3(q,-.065,0.),vec3(.023,.022,.367),1,h);
  }
  // Lid, top pedestal, looped metal hanging handle (three-dimensional).
  addBox(o,d,invD,vec3(0.,.390,0.),vec3(.206,.036,.205),1,h);
  addBox(o,d,invD,vec3(0.,.489,0.),vec3(.066,.078,.067),1,h);
  addBox(o,d,invD,vec3(0.,.589,0.),vec3(.225,.048,.055),1,h);
  for(int a=0;a<2;a++){
    float x=a==0?-.205:.205;
    addBox(o,d,invD,vec3(x,.780,0.),vec3(.040,.173,.052),1,h);
  }
  addBox(o,d,invD,vec3(0.,.967,0.),vec3(.254,.046,.057),1,h);
  addBox(o,d,invD,vec3(0.,1.037,0.),vec3(.068,.045,.071),1,h);
}
// Only resolvable lanterns are intersected individually. When its projected
// 3D bounding diameter falls below uPixelLod pixels, the infinite remainder
// is handled by analytic radiative transfer rather than a finite scene edge.
Hit traceScene(vec3 ro,vec3 rd,int budget){
  Hit result=emptyHit();
  vec3 cell=floor(ro/uSpacing+.5);
  vec3 stepDir=sign(rd);
  vec3 invD=safeInv(rd);
  vec3 span=abs(uSpacing*invD);
  vec3 boundary=(cell+.5*stepDir)*uSpacing;
  vec3 edge=(boundary-ro)*invD;
  if(abs(rd.x)<1.e-6){edge.x=FAR;span.x=FAR;}
  if(abs(rd.y)<1.e-6){edge.y=FAR;span.y=FAR;}
  if(abs(rd.z)<1.e-6){edge.z=FAR;span.z=FAR;}
  // Pixel-cone termination: LOD changes with *actual render resolution*, FOV and object scale.
  float focalPx=uResolution.y/(2.*uTanHalfFov);
  float pixelDistance=(uSize*2.16)*focalPx/max(uPixelLod,.1);
  float lastEnd=0.;
  for(int k=0;k<1024;k++){
    float endT=min(edge.x,min(edge.y,edge.z));
    // No finite outer lattice boundary: unresolved rays return an infinite-medium state.
    if(endT>=pixelDistance || k>=budget){result.t=min(endT,pixelDistance);result.mat=3;return result;}
    vec3 localO=(ro-cell*uSpacing)/uSize;
    vec3 localD=rd/uSize;
    vec3 invLocal=safeInv(localD);
    float ta,tb;
    if(intervalBox(localO,invLocal,vec3(0.,.28,0.),vec3(.55,.81,.55),ta,tb)&&ta<endT+.001){
      Hit h=emptyHit();h.t=endT+.003;
      lantern(localO,localD,invLocal,h);
      if(h.mat!=0&&h.t<=endT+.003){h.cell=cell;return h;}
    }
    lastEnd=endT;
    if(edge.x<=edge.y&&edge.x<=edge.z){cell.x+=stepDir.x;edge.x+=span.x;}
    else if(edge.y<=edge.z){cell.y+=stepDir.y;edge.y+=span.y;}
    else{cell.z+=stepDir.z;edge.z+=span.z;}
  }
  result.t=lastEnd;result.mat=3;return result;
}
vec3 sampleCosine(vec3 n){
  float a=6.28318530718*rand(),r=sqrt(rand());
  vec3 t=normalize(cross(abs(n.y)<.95?vec3(0.,1.,0.):vec3(1.,0.,0.),n));
  vec3 b=cross(n,t);
  return normalize(t*(r*cos(a))+b*(r*sin(a))+n*sqrt(max(0.,1.-r*r)));
}
vec3 fogColor(vec3 d){
  float nearPlane=exp(-abs(d.y)*6.0);
  float above=smoothstep(-.2,.6,d.y);
  return mix(vec3(.12,.067,.028),vec3(.47,.26,.098),nearPlane)*mix(.85,1.08,above);
}
vec3 emitted(Hit h){
  // A faceted warm-white flame through amber quadrants; frame geometry occludes it.
  vec3 a=abs(h.local);
  float edge=max(abs(h.local.x),abs(h.local.z));
  float centerGlow=1.-smoothstep(.025,.36,length(h.local.xz)*.7+abs(h.local.y+.06)*.45);
  float seed=hashCell(h.cell);
  return vec3(15.8,8.3,2.75)*(1.+centerGlow*.65)*mix(.85,1.16,seed);
}
vec3 sky(vec3 d){float level=exp(-abs(d.y)*7.);return mix(vec3(.026,.015,.012),vec3(.25,.14,.047),level*.82);}
// For the unresolved infinite tail, integrate the mean luminous cross-section
// of one 3D lantern per uSpacing^3. The result converges for infinite depth;
// it does not substitute a finite-distance sky or a black far clipping plane.
vec3 infiniteTail(vec3 d){
  float sigmaLamp=1.15*uSize*uSize/max(.001,uSpacing*uSpacing*uSpacing);
  float sigmaFog=uFog*.006;
  vec3 meanSurface=vec3(7.9,4.35,1.58);
  return (sigmaLamp*meanSurface+sigmaFog*fogColor(d)*.8)/(sigmaLamp+sigmaFog+1.e-6);
}
vec3 integrate(vec3 o,vec3 d,out float feature){
  vec3 radiance=vec3(0.),throughput=vec3(1.);
  feature=.98;
  for(int bounce=0;bounce<3;bounce++){
    if(bounce>=uBounces)break;
    // The secondary rays can merge earlier because the rough metal reflection
    // is already a broad angular filter; neither branch clips the infinite space.
    int budget=bounce==0?1024:320;
    Hit h=traceScene(o,d,budget);
    if(bounce==0)feature=h.mat==3?.98:(h.mat==2?.12:.52)+.16*clamp(log2(1.+h.t)/12.,0.,1.);
    float transmittance=exp(-h.t*uFog*.006);
    radiance+=throughput*(1.-transmittance)*fogColor(d)*.8;
    throughput*=transmittance;
    if(h.mat==3){radiance+=throughput*infiniteTail(d);break;}
    vec3 p=o+d*h.t;
    if(h.mat==2){radiance+=throughput*emitted(h);break;}
    vec3 normal=h.n;
    vec3 albedo=vec3(.51,.313,.152);
    float roughness=.70;
    vec3 reflected=reflect(d,normal);
    vec3 diffused=sampleCosine(normal);
    radiance+=throughput*vec3(.085,.042,.013)*(.65+.35*max(normal.y,0.));
    throughput*=albedo;
    d=normalize(mix(reflected,diffused,roughness));
    o=p+normal*.008;
    if(bounce==uBounces-1)radiance+=throughput*infiniteTail(d)*.25;

}
vec3 unpackValue(vec3 c){return uPacked?(-log(max(vec3(.0001),vec3(1.)-c))/.22):c;}
vec3 packValue(vec3 c){return uPacked?(vec3(1.)-exp(-c*.22)):c;}
void main(){
  ivec2 pix=ivec2(gl_FragCoord.xy);
  state=uint(pix.x)*1973u+uint(pix.y)*9277u+uint(uFrame+1)*26699u+911u;
  // Per-pixel scrambled low-discrepancy sequence distributes samples evenly.
  vec2 cell=vec2(pix);
  vec2 shift=fract(sin(vec2(dot(cell,vec2(127.1,311.7)),dot(cell,vec2(269.5,183.3))))*43758.5453);
  vec2 jitter=fract(vec2(float(uFrame)*.7548776662466927,float(uFrame)*.5698402909980532)+shift)-.5;
  vec2 ndc=((gl_FragCoord.xy+jitter)/uResolution)*2.-1.;

  vec3 dir=normalize(uBasis*vec3(ndc.x*uTanHalfFov,ndc.y*uTanHalfFov,1.));
  float feature;
  vec3 sampleColor=integrate(uEye,dir,feature);
  vec4 history=uFrame>0?texelFetch(uHistory,pix,0):vec4(0.);

  vec3 average=(previous*samples+sampleColor)/(samples+1.);
  float averageFeature=(history.a*samples+feature)/(samples+1.);
  outColor=vec4(packValue(average),averageFeature);
}`;
const displaySource=`#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uImage;
uniform vec2 uTexel;
uniform float uExposure;
uniform float uBloom;
uniform int uSamples;
uniform float uDenoise;
uniform bool uPacked;
vec3 sampleHdr(vec2 uv){vec3 c=texture(uImage,clamp(uv,vec2(0.),vec2(1.))).rgb;return uPacked?-log(max(vec3(.0001),vec3(1.)-c))/.22:c;}
vec3 filmic(vec3 c){return clamp((c*(2.51*c+.03))/(c*(2.43*c+.59)+.14),0.,1.);}
void main(){
  float band=exp(-pow((vUv.y-.30)/.34,2.));
  float atmosphericGrade=mix(.25,1.0,band);
  vec4 centerData=texture(uImage,vUv);
  vec3 center=sampleHdr(vUv);
  vec3 raw=center;
  if(uDenoise>.001){
    // Cross-bilateral: depth/material guide from primary ray is in history alpha.
    // Preserve small emissive panels while smoothing diffuse bounce variance.
    float guide=centerData.a;
    float centerLum=dot(center,vec3(.2126,.7152,.0722));
    vec3 total=vec3(0.);
    float sum=0.;
    for(int y=-2;y<=2;y++)for(int x=-2;x<=2;x++){
      vec2 uv=clamp(vUv+vec2(float(x),float(y))*uTexel,vec2(0.),vec2(1.));
      vec4 data=texture(uImage,uv);
      vec3 rgb=uPacked?-log(max(vec3(.0001),vec3(1.)-data.rgb))/.22:data.rgb;
      float lum=dot(rgb,vec3(.2126,.7152,.0722));
      float spatial=exp(-float(x*x+y*y)*.15);
      float geometry=exp(-abs(guide-data.a)*22.);
      // A loose color guide prevents filtering across lantern silhouettes.
      float chroma=.26+.74*exp(-abs(log(1.+centerLum)-log(1.+lum))*2.0);
      float w=spatial*geometry*chroma;
      total+=rgb*w;
      sum+=w;
    }
    raw=mix(center,total/max(sum,.0001),uDenoise);
  }
  vec3 original=raw*uExposure*atmosphericGrade;
  vec3 bloomInput=vec3(0.);
  vec2 o=uTexel*3.;
  vec3 v;
  v=sampleHdr(vUv+vec2(o.x,0.));bloomInput+=v*.16;
  v=sampleHdr(vUv-vec2(o.x,0.));bloomInput+=v*.16;
  v=sampleHdr(vUv+vec2(0.,o.y));bloomInput+=v*.16;
  v=sampleHdr(vUv-vec2(0.,o.y));bloomInput+=v*.16;
  o=uTexel*10.;
  v=sampleHdr(vUv+vec2(o.x,o.y));bloomInput+=v*.09;
  v=sampleHdr(vUv+vec2(-o.x,o.y));bloomInput+=v*.09;
  v=sampleHdr(vUv+vec2(o.x,-o.y));bloomInput+=v*.09;
  v=sampleHdr(vUv+vec2(-o.x,-o.y));bloomInput+=v*.09;

  vec3 bloom=max(bloomInput-vec3(1.2),vec3(0.));

  float vignette=1.-.18*pow(length((vUv-.5)*vec2(1.35,1.0)),2.);
  outColor=vec4(color*vignette,1.);
}`;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function program(vs,fs){const p=gl.createProgram();gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}
try{programTrace=program(vertexSource,traceSource);programDisplay=program(vertexSource,displaySource);}catch(e){fail('シェーダーのコンパイルに失敗しました: '+e.message);return;}
const vao=gl.createVertexArray();gl.bindVertexArray(vao);
const queryUniforms=(p,names)=>Object.fromEntries(names.map(n=>[n,gl.getUniformLocation(p,n)]));
locTrace=queryUniforms(programTrace,['uHistory','uResolution','uBasis','uEye','uFrame','uPixelLod','uBounces','uSpacing','uSize','uTanHalfFov','uFog','uPacked']);
locDisplay=queryUniforms(programDisplay,['uImage','uTexel','uExposure','uBloom','uSamples','uDenoise','uPacked']);
function makeTarget(){const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,colorFloat?gl.RGBA32F:gl.RGBA8,pixelWidth,pixelHeight,0,gl.RGBA,colorFloat?gl.FLOAT:gl.UNSIGNED_BYTE,null);const framebuffer=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,framebuffer);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('描画バッファを作成できません');return{tex,framebuffer};}
function resize(){const displayRatio=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(innerWidth*displayRatio));canvas.height=Math.max(1,Math.floor(innerHeight*displayRatio));pixelWidth=Math.max(1,Math.floor(canvas.width*settings.quality));pixelHeight=Math.max(1,Math.floor(canvas.height*settings.quality));for(const t of targets){gl.deleteFramebuffer(t.framebuffer);gl.deleteTexture(t.tex);}targets=[];try{targets=[makeTarget(),makeTarget()];}catch(e){fail(e.message);return;}targetIndex=0;frame=0;dirty=true;}
function basis(){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const right=[cy,0,sy],up=[-sy*sp,cp,cy*sp],forward=[sy*cp,sp,-cy*cp];return{right,up,forward,flat:[sy,0,-cy]};}
function render(){if(!canRender||targets.length!==2)return;const b=basis();const next=1-targetIndex;
  gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);gl.useProgram(programTrace);gl.viewport(0,0,pixelWidth,pixelHeight);gl.bindFramebuffer(gl.FRAMEBUFFER,targets[next].framebuffer);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,targets[targetIndex].tex);
  gl.uniform1i(locTrace.uHistory,0);gl.uniform2f(locTrace.uResolution,pixelWidth,pixelHeight);gl.uniformMatrix3fv(locTrace.uBasis,false,new Float32Array([...b.right,...b.up,...b.forward]));gl.uniform3fv(locTrace.uEye,new Float32Array(position));gl.uniform1i(locTrace.uFrame,frame);gl.uniform1f(locTrace.uPixelLod,settings.lod);gl.uniform1i(locTrace.uBounces,settings.bounces);gl.uniform1f(locTrace.uSpacing,settings.spacing);gl.uniform1f(locTrace.uSize,settings.size);gl.uniform1f(locTrace.uTanHalfFov,Math.tan(settings.fov*Math.PI/360));gl.uniform1f(locTrace.uFog,settings.fog);gl.uniform1i(locTrace.uPacked,colorFloat?0:1);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(programDisplay);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,targets[next].tex);gl.uniform1i(locDisplay.uImage,0);gl.uniform2f(locDisplay.uTexel,1/pixelWidth,1/pixelHeight);gl.uniform1f(locDisplay.uExposure,settings.exposure);gl.uniform1f(locDisplay.uBloom,settings.bloom);gl.uniform1i(locDisplay.uSamples,frame+1);gl.uniform1f(locDisplay.uDenoise,settings.denoise);gl.uniform1i(locDisplay.uPacked,colorFloat?0:1);gl.drawArrays(gl.TRIANGLES,0,3);
  targetIndex=next;frame++;dirty=false;
  stats.textContent=`${frame.toString().padStart(3,'0')} SPP · ${pixelWidth}×${pixelHeight} · ${fps.toFixed(0)} FPS`;
}
function invalidate(){frame=0;dirty=true;}
function move(dt){const b=basis(),speed=(keys.has('shift')?11:3.8)*dt;let dx=0,dy=0,dz=0;const down=k=>keys.has(k);
  if(down('w')||down('arrowup')){dx+=b.flat[0]*speed;dz+=b.flat[2]*speed;}
  if(down('s')||down('arrowdown')){dx-=b.flat[0]*speed;dz-=b.flat[2]*speed;}
  if(down('a')||down('arrowleft')){dx-=b.right[0]*speed;dz-=b.right[2]*speed;}
  if(down('d')||down('arrowright')){dx+=b.right[0]*speed;dz+=b.right[2]*speed;}
  if(down('e')||down(' '))dy+=speed;if(down('q'))dy-=speed;
  if(dx||dy||dz){position[0]+=dx;position[1]+=dy;position[2]+=dz;invalidate();return true;}
  return false;
}
function loop(now){requestAnimationFrame(loop);if(!canRender)return;const dt=lastTime?Math.min((now-lastTime)/1000,.05):0;lastTime=now;const didMove=move(dt);if(settings.drift&&!dragging&&!keys.size){yaw+=dt*.035;invalidate();}
  if(frame<settings.samples||dirty||didMove)render();framesForFps++;if(now-fpsTime>950){fps=framesForFps*1000/Math.max(1,now-fpsTime);framesForFps=0;fpsTime=now;}
}
function rotate(dx,dy){yaw-=dx*.0027;pitch=clamp(pitch-dy*.0027,-1.51,1.51);invalidate();}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||document.pointerLockElement===canvas)return;dragging=true;lastPointer=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(document.pointerLockElement===canvas){rotate(e.movementX,e.movementY);return;}if(!dragging)return;rotate(e.clientX-lastPointer[0],e.clientY-lastPointer[1]);lastPointer=[e.clientX,e.clientY];});
function stopDrag(){dragging=false;}canvas.addEventListener('pointerup',stopDrag);canvas.addEventListener('pointercancel',stopDrag);
canvas.addEventListener('dblclick',()=>{if(document.pointerLockElement===canvas)document.exitPointerLock();else canvas.requestPointerLock?.();});
canvas.addEventListener('wheel',e=>{e.preventDefault();settings.fov=clamp(settings.fov+Math.sign(e.deltaY)*2,45,110);sync();invalidate();},{passive:false});
window.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement||e.target instanceof HTMLButtonElement)return;const k=e.key.toLowerCase();if(k==='h'){document.body.classList.toggle('ui-hidden');return;}if(k==='r'){resetCamera();return;}if(k==='escape'){panel.classList.remove('open');settingsButton.setAttribute('aria-expanded','false');return;}if('wasdqe'.includes(k)||k.startsWith('arrow')||k==='shift'||k===' '){keys.add(k);e.preventDefault();}});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
function resetCamera(){position=home.pos.slice();yaw=home.yaw;pitch=home.pitch;invalidate();}
function capture(){render();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='infinite-lanterns.png';a.click();}
get('resetButton').addEventListener('click',resetCamera);get('resetPanelButton').addEventListener('click',resetCamera);get('captureButton').addEventListener('click',capture);get('capturePanelButton').addEventListener('click',capture);
settingsButton.addEventListener('click',()=>{const open=!panel.classList.contains('open');panel.classList.toggle('open',open);settingsButton.setAttribute('aria-expanded',String(open));});
get('driftButton').addEventListener('click',()=>{settings.drift=!settings.drift;sync();invalidate();});
const ranges={quality:[100,'%'],lod:[10,' px'],bounces:[1,''],samples:[1,''],denoise:[100,'%'],spacing:[10,''],size:[100,'%'],fov:[1,'°'],exposure:[100,'%'],bloom:[100,'%'],fog:[100,'%']};
function sync(){for(const [name,[factor,suffix]] of Object.entries(ranges)){const value=Math.round(settings[name]*factor);get(name).value=value;get(name+'Out').textContent=name==='lod'?(value/10).toFixed(1)+' px':value+suffix;const slider=get(name);const fill=(value-Number(slider.min))/(Number(slider.max)-Number(slider.min))*100;slider.style.setProperty('--fill',fill+'%');}get('driftButton').setAttribute('aria-checked',String(settings.drift));}
for(const [name,[factor]] of Object.entries(ranges))get(name).addEventListener('input',e=>{settings[name]=Number(e.target.value)/factor;if(name==='quality')resize();else if(name!=='denoise')invalidate();else {dirty=true;}sync();});
window.addEventListener('resize',resize);sync();resize();stats.textContent='PATH TRACING';requestAnimationFrame(loop);
})();
