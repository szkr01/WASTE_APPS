name: Fix KSKRM2 preview contrast

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch preview checker contrast
        shell: python
        run: |
          from pathlib import Path
          path = Path('pages/KSKRM2.html')
          text = path.read_text()
          old = '''        #ckPreviewContainer,
                  #chromaModalContent section,
                  #textEditorModalContent .fx-checker {
                      background-color: var(--ds-selector) !important;
                      box-shadow: none !important;
                  }'''
          new = old + '''

                  #textEditorModalContent .fx-checker {
                      background-image:
                          linear-gradient(45deg, var(--ds-workspace-grid) 25%, transparent 25%),
                          linear-gradient(-45deg, var(--ds-workspace-grid) 25%, transparent 25%),
                          linear-gradient(45deg, transparent 75%, var(--ds-workspace-grid) 75%),
                          linear-gradient(-45deg, transparent 75%, var(--ds-workspace-grid) 75%) !important;
                  }'''
          if old not in text:
              raise SystemExit('target CSS block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-kskrm2-preview-contrast.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/KSKRM2.html .github/workflows/fix-kskrm2-preview-contrast.yml
          git commit -m "Fix KSKRM2 text preview checker contrast"
          git push
